<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
      maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Zombie Road</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(#59656b 0%,#30383b 32%,#17191a 100%);
}

/* آسمان */

#sky{
  position:absolute;
  inset:0 0 55% 0;
  background:
    linear-gradient(#596970,#879197 45%,#51595c);
}

/* جاده */

#road{
  position:absolute;
  left:10%;
  right:10%;
  top:25%;
  bottom:-10%;
  background:
    linear-gradient(90deg,
      #202323 0%,
      #444746 18%,
      #2d302f 50%,
      #444746 82%,
      #202323 100%);
  transform:perspective(400px) rotateX(8deg);
  transform-origin:center top;
  overflow:hidden;
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:5px;
  background:#b9b49c;
}

#road:before{left:4%}
#road:after{right:4%}

/* خطوط جاده */

#lines{
  position:absolute;
  inset:0;
}

.line{
  position:absolute;
  width:7px;
  height:90px;
  background:#ddd;
  left:50%;
  transform:translateX(-50%);
}

/* محیط */

.tree{
  position:absolute;
  font-size:55px;
  z-index:2;
  filter:drop-shadow(0 8px 5px #0008);
}

/* ماشین */

#car{
  position:absolute;
  z-index:30;
  bottom:18%;
  left:50%;
  width:100px;
  height:165px;
  transform:translateX(-50%);
  transition:left .08s linear;
}

.carBody{
  position:absolute;
  inset:15px 12px;
  border-radius:22px 22px 15px 15px;
  background:
    linear-gradient(90deg,#171717,#555,#171717);
  border:3px solid #111;
  box-shadow:
    0 15px 25px #000b,
    inset 0 0 15px #aaa5;
}

.carGlass{
  position:absolute;
  left:25px;
  right:25px;
  top:28px;
  height:50px;
  border-radius:10px;
  background:
    linear-gradient(135deg,#18262d,#607078,#172328);
  border:2px solid #111;
}

.light{
  position:absolute;
  width:18px;
  height:10px;
  bottom:25px;
  background:#ffdf82;
  border-radius:4px;
}

.light.l{left:19px}
.light.r{right:19px}

/* زامبی */

.zombie{
  position:absolute;
  z-index:25;
  width:58px;
  height:82px;
  transition:transform .05s linear;
}

.zombie .head{
  position:absolute;
  top:0;
  left:15px;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#6f776d;
  border:2px solid #292d29;
}

.zombie .body{
  position:absolute;
  top:27px;
  left:9px;
  width:40px;
  height:55px;
  border-radius:12px 12px 5px 5px;
  background:#424c43;
  border:2px solid #242824;
}

/* HUD */

#hud{
  position:absolute;
  z-index:100;
  top:env(safe-area-inset-top,8px);
  left:8px;
  right:8px;
  display:flex;
  gap:6px;
  justify-content:space-between;
  padding:8px;
}

.box{
  background:#080909dd;
  border:1px solid #8c742e;
  color:white;
  border-radius:7px;
  padding:7px 10px;
  font-size:13px;
  font-weight:bold;
}

#healthBar{
  width:90px;
  height:8px;
  background:#300;
  border-radius:5px;
  overflow:hidden;
  margin-top:4px;
}

#health{
  width:100%;
  height:100%;
  background:#d33;
}

/* کنترل */

#controls{
  position:absolute;
  z-index:110;
  left:0;
  right:0;
  bottom:env(safe-area-inset-bottom,10px);
  height:145px;
  pointer-events:none;
}

button{
  border:0;
  color:white;
  font-weight:bold;
}

.ctrl{
  position:absolute;
  pointer-events:auto;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#111c;
  border:2px solid #aaa;
  font-size:28px;
}

#left{
  left:18px;
  bottom:15px;
}

#right{
  left:100px;
  bottom:15px;
}

#fire{
  right:25px;
  bottom:40px;
  width:82px;
  height:82px;
  background:#941b14dd;
  border-color:#e36b5c;
}

#nitro{
  right:120px;
  bottom:20px;
  width:65px;
  height:65px;
  background:#155b83dd;
}

/* پنل */

#panel{
  display:none;
  position:absolute;
  z-index:200;
  inset:0;
  background:#000d;
  overflow:auto;
  padding:30px 15px;
}

.panel{
  max-width:500px;
  margin:auto;
  background:#15191a;
  border:1px solid #a78832;
  border-radius:10px;
  padding:18px;
  color:white;
}

.card{
  background:#222729;
  border:1px solid #555;
  border-radius:8px;
  padding:12px;
  margin:8px 0;
}

.upgrade{
  width:100%;
  padding:12px;
  border-radius:6px;
  background:#80630d;
  border:1px solid #d3aa3e;
}

.close{
  width:100%;
  padding:13px;
  margin-top:10px;
  background:#444;
  border-radius:6px;
}

#menu{
  position:absolute;
  z-index:150;
  top:65px;
  right:10px;
  padding:8px 12px;
  border-radius:6px;
  background:#111c;
  border:1px solid #777;
}

/* پیام */

#message{
  position:absolute;
  z-index:300;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  background:#070707ee;
  border:1px solid #c49c35;
  padding:15px 25px;
  border-radius:8px;
  color:white;
  font-weight:bold;
  display:none;
  text-align:center;
}
</style>
</head>

<body>

<div id="game">

  <div id="sky"></div>

  <div id="road">
    <div id="lines"></div>
  </div>

  <div id="hud">

    <div class="box">
      ❤️
      <div id="healthBar">
        <div id="health"></div>
      </div>
    </div>

    <div class="box">
      ☠️ <span id="kills">0</span>
    </div>

    <div class="box">
      🪙 <span id="coins">0</span>
    </div>

    <div class="box">
      🎯 <span id="mission">0/50</span>
    </div>

  </div>

  <button id="menu">⚙️</button>

  <div id="car">
    <div class="carBody"></div>
    <div class="carGlass"></div>
    <div class="light l"></div>
    <div class="light r"></div>
  </div>

  <div id="controls">

    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>

    <button class="ctrl" id="fire">🔥</button>

    <button class="ctrl" id="nitro">⚡</button>

  </div>

  <div id="panel">

    <div class="panel">

      <h2>🚗 گاراژ</h2>

      <p>
        🪙 سکه:
        <b id="garageCoins">0</b>
      </p>

      <div class="card">
        🔫 قدرت سلاح:
        <b id="damageLevel">1</b>

        <button class="upgrade"
                onclick="upgradeDamage()">
          ارتقا
        </button>
      </div>

      <div class="card">
        🛡️ زره:
        <b id="armorLevel">1</b>

        <button class="upgrade"
                onclick="upgradeArmor()">
          ارتقا
        </button>
      </div>

      <div class="card">
        ⚡ Nitro:
        <b id="nitroLevel">1</b>

        <button class="upgrade"
                onclick="upgradeNitro()">
          ارتقا
        </button>
      </div>

      <div class="card">
        🎯 سرعت شلیک:
        <b id="fireLevel">1</b>

        <button class="upgrade"
                onclick="upgradeFire()">
          ارتقا
        </button>
      </div>

      <div class="card">

        <h3>🎯 مأموریت</h3>

        <p>
          کشتن ۵۰ زامبی
        </p>

        <p>
          پیشرفت:
          <b id="missionPanel">0/50</b>
        </p>

        <button class="upgrade"
                onclick="claimMission()">
          دریافت پاداش
        </button>

      </div>

      <button class="close"
              onclick="closePanel()">
        بازگشت
      </button>

    </div>

  </div>

  <div id="message"></div>

</div>

<script>

/* =================================
   TELEGRAM
================================= */

const tg =
  window.Telegram &&
  Telegram.WebApp
    ? Telegram.WebApp
    : null;

if(tg){

  tg.ready();

  tg.expand();

  if(tg.requestFullscreen){

    try{
      tg.requestFullscreen();
    }catch(e){}

  }

  if(tg.disableVerticalSwipes){

    try{
      tg.disableVerticalSwipes();
    }catch(e){}

  }
}


/* =================================
   SAVE DATA
================================= */

let save =
JSON.parse(
  localStorage.getItem("zombieRoadSave") ||
  "{}"
);

let coins =
save.coins || 0;

let kills =
save.kills || 0;

let damageLevel =
save.damageLevel || 1;

let armorLevel =
save.armorLevel || 1;

let nitroLevel =
save.nitroLevel || 1;

let fireLevel =
save.fireLevel || 1;

let missionReward =
save.missionReward || false;


/* =================================
   GAME
================================= */

let health = 100;

let lane = 0;

let speed = 1;

let nitro = 100;

let firing = false;

let gameOver = false;

let zombies = [];

let bullets = [];

let roadOffset = 0;

let spawnTimer = 0;

let fireTimer = 0;

const car =
document.getElementById("car");

const road =
document.getElementById("road");

const lines =
document.getElementById("lines");


/* =================================
   ROAD LINES
================================= */

for(let i=0;i<10;i++){

  const line =
  document.createElement("div");

  line.className="line";

  line.style.top =
    (i*120)+"px";

  lines.appendChild(line);
}


/* =================================
   ENVIRONMENT
================================= */

let trees=[];

for(let i=0;i<12;i++){

  const tree =
  document.createElement("div");

  tree.className="tree";

  tree.textContent =
    Math.random()>0.5
    ? "🌲"
    : "🌳";

  tree.style.left =
    Math.random()>0.5
    ? "1%"
    : "90%";

  tree.style.top =
    (Math.random()*100)+"%";

  document.getElementById("game")
    .appendChild(tree);

  trees.push({
    el:tree,
    y:Math.random()*100
  });
}


/* =================================
   CAR POSITION
================================= */

function updateCar(){

  const positions =
    ["34%","50%","66%"];

  car.style.left =
    positions[lane+1];
}


/* =================================
   LEFT / RIGHT
================================= */

function moveLeft(){

  if(gameOver)return;

  lane--;

  if(lane < -1)
    lane=-1;

  updateCar();

  haptic();

}

function moveRight(){

  if(gameOver)return;

  lane++;

  if(lane > 1)
    lane=1;

  updateCar();

  haptic();

}


/* =================================
   SHOOT
================================= */

function shoot(){

  if(gameOver)return;

  if(fireTimer>0)return;

  fireTimer =
    Math.max(
      .08,
      .24 -
      fireLevel*.015
    );

  const bullet =
    document.createElement("div");

  bullet.style.position="absolute";

  bullet.style.zIndex="40";

  bullet.style.width="7px";

  bullet.style.height="22px";

  bullet.style.background="#ffd84a";

  bullet.style.boxShadow=
    "0 0 15px #ff9d00";

  bullet.style.borderRadius="5px";

  bullet.style.left =
    car.offsetLeft +
    car.offsetWidth/2 -
    3+"px";

  bullet.style.top =
    car.offsetTop -
    10+"px";

  document.getElementById("game")
    .appendChild(bullet);

  bullets.push({
    el:bullet,
    x:parseFloat(bullet.style.left),
    y:parseFloat(bullet.style.top)
  });

  haptic();

}


/* =================================
   ZOMBIE
================================= */

function spawnZombie(){

  const z =
    document.createElement("div");

  z.className="zombie";

  z.innerHTML=
  `
    <div class="head"></div>
    <div class="body"></div>
  `;

  const zLane =
    Math.floor(Math.random()*3)-1;

  const positions =
    ["34%","50%","66%"];

  z.style.left =
    positions[zLane+1];

  z.style.top="-100px";

  document.getElementById("game")
    .appendChild(z);

  zombies.push({
    el:z,
    lane:zLane,
    y:-100,
    hp:100
  });

}


/* =================================
   ZOMBIE UPDATE
================================= */

function updateZombies(dt){

  for(let i=zombies.length-1;i>=0;i--){

    const z=zombies[i];

    z.y +=
      dt *
      (0.18 + speed*.08);

    z.el.style.top =
      z.y+"px";

    if(z.y>window.innerHeight){

      z.el.remove();

      zombies.splice(i,1);

      continue;

    }


    /* برخورد با ماشین */

    if(
      z.y >
      car.offsetTop-50 &&
      z.y <
      car.offsetTop+120 &&
      z.lane===lane
    ){

      damageCar(.15);

    }

  }

}


/* =================================
   BULLETS
================================= */

function updateBullets(dt){

  for(let i=bullets.length-1;i>=0;i--){

    const b=bullets[i];

    b.y -= dt*.8;

    b.el.style.top=
      b.y+"px";

    let hit=false;

    for(let j=zombies.length-1;j>=0;j--){

      const z=zombies[j];

      if(
        Math.abs(
          b.x -
          z.el.offsetLeft
        ) < 45 &&
        Math.abs(
          b.y -
          z.y
        ) < 65
      ){

        z.hp -=
          25 +
          damageLevel*10;

        hit=true;

        if(z.hp<=0){

          killZombie(j);

        }

        break;

      }

    }

    if(
      hit ||
      b.y < -50
    ){

      b.el.remove();

      bullets.splice(i,1);

    }

  }

}


/* =================================
   KILL
================================= */

function killZombie(index){

  const z =
    zombies[index];

  z.el.remove();

  zombies.splice(index,1);

  kills++;

  coins += 5;

  updateHUD();

  saveGame();

  if(kills%10===0){

    showMessage(
      "🔥 "+kills+
      " کشتار!"
    );

  }

}


/* =================================
   CAR DAMAGE
================================= */

function damageCar(amount){

  health -=
    amount *
    Math.max(
      .35,
      1 -
      armorLevel*.08
    );

  if(health<0)
    health=0;

  updateHUD();

  if(health<=0){

    endGame();

  }

}


/* =================================
   NITRO
================================= */

function startNitro(){

  if(nitro<=0)return;

  speed=3;

}

function stopNitro(){

  speed=1;

}


/* =================================
   ROAD MOTION
================================= */

function updateRoad(dt){

  roadOffset +=
    dt *
    (.25 + speed*.22);

  if(roadOffset>120)
    roadOffset=0;

  const lineEls =
    document.querySelectorAll(".line");

  lineEls.forEach(
    (line,index)=>{

      let y =
        index*120 +
        roadOffset;

      if(y>window.innerHeight)
        y=-100;

      line.style.top=y+"px";

    }
  );


  trees.forEach(t=>{

    t.y +=
      dt *
      (.06 + speed*.04);

    if(t.y>110)
      t.y=-10;

    t.el.style.top=
      t.y+"%";

  });

}


/* =================================
   GAME LOOP
================================= */

let last =
performance.now();

function loop(now){

  const dt =
    Math.min(
      40,
      now-last
    );

  last=now;

  if(!gameOver){

    fireTimer -=
      dt/1000;

    spawnTimer -=
      dt/1000;

    if(firing)
      shoot();

    if(spawnTimer<=0){

      spawnZombie();

      spawnTimer =
        Math.max(
          .45,
          1.2 -
          kills*.004
        );

    }

    updateRoad(dt);

    updateZombies(dt);

    updateBullets(dt);

  }

  requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =================================
   CONTROLS
================================= */

function holdButton(
  element,
  down,
  up
){

  element.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      down();
    }
  );

  ["pointerup",
   "pointercancel",
   "pointerleave"]
  .forEach(
    event=>{
      element.addEventListener(
        event,
        e=>{
          e.preventDefault();
          up();
        }
      );
    }
  );

}


holdButton(
  document.getElementById("left"),
  moveLeft,
  ()=>{}
);

holdButton(
  document.getElementById("right"),
  moveRight,
  ()=>{}
);

holdButton(
  document.getElementById("fire"),
  ()=>firing=true,
  ()=>firing=false
);

holdButton(
  document.getElementById("nitro"),
  startNitro,
  stopNitro
);


/* =================================
   KEYBOARD
================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft();

    if(e.key==="ArrowRight")
      moveRight();

    if(e.code==="Space")
      firing=true;

    if(e.key.toLowerCase()==="n")
      startNitro();

  }
);

document.addEventListener(
  "keyup",
  e=>{

    if(e.code==="Space")
      firing=false;

    if(e.key.toLowerCase()==="n")
      stopNitro();

  }
);


/* =================================
   HUD
================================= */

function updateHUD(){

  document.getElementById(
    "kills"
  ).textContent=kills;

  document.getElementById(
    "coins"
  ).textContent=coins;

  document.getElementById(
    "mission"
  ).textContent=
    Math.min(kills,50)+"/50";

  document.getElementById(
    "missionPanel"
  ).textContent=
    Math.min(kills,50)+"/50";

  document.getElementById(
    "garageCoins"
  ).textContent=coins;

  document.getElementById(
    "damageLevel"
  ).textContent=damageLevel;

  document.getElementById(
    "armorLevel"
  ).textContent=armorLevel;

  document.getElementById(
    "nitroLevel"
  ).textContent=nitroLevel;

  document.getElementById(
    "fireLevel"
  ).textContent=fireLevel;

  document.getElementById(
    "health"
  ).style.width=
    health+"%";

}


/* =================================
   UPGRADES
================================= */

function buy(cost){

  if(coins<cost){

    showMessage(
      "🪙 سکه کافی نیست"
    );

    return false;

  }

  coins-=cost;

  return true;

}

function upgradeDamage(){

  const cost=
    damageLevel*100;

  if(!buy(cost))
    return;

  damageLevel++;

  saveGame();

  updateHUD();

}

function upgradeArmor(){

  const cost=
    armorLevel*120;

  if(!buy(cost))
    return;

  armorLevel++;

  saveGame();

  updateHUD();

}

function upgradeNitro(){

  const cost=
    nitroLevel*150;

  if(!buy(cost))
    return;

  nitroLevel++;

  saveGame();

  updateHUD();

}

function upgradeFire(){

  const cost=
    fireLevel*180;

  if(!buy(cost))
    return;

  fireLevel++;

  saveGame();

  updateHUD();

}


/* =================================
   MISSION
================================= */

function claimMission(){

  if(kills<50){

    showMessage(
      "🎯 هنوز مأموریت کامل نشده"
    );

    return;

  }

  if(missionReward){

    showMessage(
      "🎁 پاداش قبلاً گرفته شده"
    );

    return;

  }

  missionReward=true;

  coins+=2000;

  saveGame();

  updateHUD();

  showMessage(
    "🎉 ۲۰۰۰ سکه دریافت کردی!"
  );

}


/* =================================
   PANEL
================================= */

document.getElementById(
  "menu"
).addEventListener(
  "click",
  ()=>{
    document.getElementById(
      "panel"
    ).style.display="block";

    updateHUD();

  }
);

function closePanel(){

  document.getElementById(
    "panel"
  ).style.display="none";

}


/* =================================
   GAME OVER
================================= */

function endGame(){

  gameOver=true;

  firing=false;

  stopNitro();

  showMessage(
    "💀 GAME OVER<br><br>"+
    "☠️ کشتار: "+kills+
    "<br>🪙 سکه: "+coins
  );

}


/* =================================
   SAVE
================================= */

function saveGame(){

  localStorage.setItem(
    "zombieRoadSave",
    JSON.stringify({

      coins,
      kills,
      damageLevel,
      armorLevel,
      nitroLevel,
      fireLevel,
      missionReward

    })
  );

}


/* =================================
   MESSAGE
================================= */

let messageTimer;

function showMessage(text){

  const m =
    document.getElementById(
      "message"
    );

  m.innerHTML=text;

  m.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=
    setTimeout(
      ()=>{
        m.style.display="none";
      },
      1500
    );

}


/* =================================
   HAPTIC
================================= */

function haptic(){

  if(
    tg &&
    tg.HapticFeedback
  ){

    try{

      tg.HapticFeedback
        .impactOccurred("light");

    }catch(e){}

  }

}


/* =================================
   START
================================= */

updateCar();

updateHUD();

saveGame();

</script>

</body>
</html>
