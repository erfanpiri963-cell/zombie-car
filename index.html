<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Car</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07090b;
  font-family:Arial,sans-serif;
  touch-action:none;
}

.hidden{display:none!important}

/* MENU */
#menuScreen{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:
    radial-gradient(circle at 50% 30%,#555d62 0,#20262b 38%,#080a0c 100%);
}

.logo{
  font-size:clamp(34px,10vw,58px);
  font-weight:900;
  text-align:center;
  text-shadow:0 4px #000,0 10px 30px #000;
  margin-bottom:10px;
}

.subtitle{
  color:#c8ced2;
  margin-bottom:40px;
}

#startBtn,#restartBtn{
  border:0;
  border-radius:17px;
  padding:17px 42px;
  color:white;
  font-size:20px;
  font-weight:bold;
  background:linear-gradient(#f45145,#b71c1c);
  box-shadow:0 8px 25px #0009;
}

#startBtn:active,#restartBtn:active{
  transform:scale(.94);
}

/* GAME */
#gameScreen{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#111;
}

#game{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

/* HUD */
#hud{
  position:absolute;
  top:13px;
  left:12px;
  right:12px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  min-width:78px;
  padding:9px 12px;
  border-radius:13px;
  color:white;
  font-weight:bold;
  font-size:16px;
  text-align:center;
  background:#050505aa;
  border:1px solid #ffffff20;
  backdrop-filter:blur(7px);
  box-shadow:0 5px 18px #0008;
}

/* CONTROLS */
#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:22px;
  z-index:30;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  padding:0 20px;
  direction:ltr;
  align-items:center;
}

.controlBtn{
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid #ffffff25;
  color:#fff;
  background:#00000070;
  font-size:30px;
  font-weight:bold;
  box-shadow:0 6px 20px #0008;
  backdrop-filter:blur(7px);
  touch-action:none;
}

#leftBtn{justify-self:start}
#rightBtn{justify-self:end}

#fireBtn{
  justify-self:center;
  width:90px;
  height:90px;
  border-radius:50%;
  border:2px solid #ffffff30;
  color:white;
  font-size:35px;
  background:linear-gradient(#ff7043,#c62828);
  box-shadow:0 7px 25px #0009;
  touch-action:none;
}

.controlBtn:active,#fireBtn:active{
  transform:scale(.9);
}

/* GAME OVER */
#gameOver{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
  background:#000c;
}

#gameOver h1{
  font-size:44px;
  margin-bottom:15px;
}

#gameOver p{
  color:#ddd;
  margin-bottom:25px;
}
</style>
</head>

<body>

<div id="menuScreen">
  <div class="logo">🚗 ZOMBIE CAR 🧟</div>
  <div class="subtitle">جاده پر از زامبی شده...</div>
  <button id="startBtn">▶ شروع بازی</button>
</div>

<div id="gameScreen" class="hidden">

  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hudBox">❤️ <span id="hp">100</span></div>
    <div class="hudBox">🪙 <span id="coins">0</span></div>
    <div class="hudBox">☠️ <span id="kills">0</span></div>
  </div>

  <div id="controls">
    <button id="leftBtn" class="controlBtn">◀</button>
    <button id="fireBtn">🔫</button>
    <button id="rightBtn" class="controlBtn">▶</button>
  </div>

  <div id="gameOver" class="hidden">
    <h1>💀 باختی!</h1>
    <p>زامبی‌های کشته‌شده: <b id="finalKills">0</b></p>
    <button id="restartBtn">🔄 دوباره بازی کن</button>
  </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menuScreen");
const game=document.getElementById("gameScreen");

const start=document.getElementById("startBtn");
const restart=document.getElementById("restartBtn");

const left=document.getElementById("leftBtn");
const right=document.getElementById("rightBtn");
const fire=document.getElementById("fireBtn");

let W=0,H=0;
let carX=0;

let hp=100;
let coins=0;
let kills=0;

let bullets=[];
let zombies=[];
let particles=[];
let coinsFx=[];

let leftDown=false;
let rightDown=false;
let fireDown=false;

let running=false;
let last=0;
let fireTimer=0;
let spawnTimer=0;
let roadOffset=0;


/* RESIZE */

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

  if(!carX) carX=W/2;
}

addEventListener("resize",resize);


/* HUD */

function hud(){
  document.getElementById("hp").textContent=Math.max(0,hp);
  document.getElementById("coins").textContent=coins;
  document.getElementById("kills").textContent=kills;
}


/* START */

start.onclick=()=>{
  menu.classList.add("hidden");
  game.classList.remove("hidden");
  document.getElementById("gameOver").classList.add("hidden");

  resize();

  carX=W/2;
  hp=100;
  coins=0;
  kills=0;

  bullets=[];
  zombies=[];
  particles=[];
  coinsFx=[];

  fireTimer=0;
  spawnTimer=10;
  roadOffset=0;

  hud();

  running=true;
  last=performance.now();

  requestAnimationFrame(loop);
};


/* RESTART */

restart.onclick=()=>{
  start.click();
};


/* CONTROLS */

function hold(btn,on,off){

  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    on();
  });

  btn.addEventListener("pointerup",e=>{
    e.preventDefault();
    off();
  });

  btn.addEventListener("pointercancel",off);
  btn.addEventListener("pointerleave",off);
}

hold(left,()=>leftDown=true,()=>leftDown=false);
hold(right,()=>rightDown=true,()=>rightDown=false);
hold(fire,()=>fireDown=true,()=>fireDown=false);


/* KEYBOARD */

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")leftDown=true;
  if(e.key==="ArrowRight")rightDown=true;
  if(e.code==="Space")fireDown=true;
});

addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft")leftDown=false;
  if(e.key==="ArrowRight")rightDown=false;
  if(e.code==="Space")fireDown=false;
});


/* ROAD */

function road(){

  ctx.fillStyle="#0d1510";
  ctx.fillRect(0,0,W,H);

  const rw=Math.min(W*.88,520);
  const rx=(W-rw)/2;

  /* grass */

  ctx.fillStyle="#152218";
  ctx.fillRect(0,0,rx,H);
  ctx.fillRect(rx+rw,0,rx,H);

  /* asphalt */

  ctx.fillStyle="#30363a";
  ctx.fillRect(rx,0,rw,H);

  /* road texture */

  ctx.fillStyle="#3b4145";

  for(let y=-80;y<H;y+=100){
    ctx.fillRect(
      rx+15,
      y+(roadOffset%100),
      rw-30,
      2
    );
  }

  /* edges */

  ctx.fillStyle="#d2d2d2";
  ctx.fillRect(rx,0,5,H);
  ctx.fillRect(rx+rw-5,0,5,H);

  /* center */

  ctx.strokeStyle="#eee";
  ctx.lineWidth=5;
  ctx.setLineDash([42,34]);
  ctx.lineDashOffset=roadOffset;

  ctx.beginPath();
  ctx.moveTo(W/2,0);
  ctx.lineTo(W/2,H);
  ctx.stroke();

  ctx.setLineDash([]);

  roadOffset+=4;

  if(roadOffset>76)roadOffset=0;
}


/* CAR */

function car(){

  const y=H-145;

  /* shadow */

  ctx.fillStyle="#0008";

  ctx.beginPath();
  ctx.ellipse(carX,y+52,43,12,0,0,Math.PI*2);
  ctx.fill();


  /* back lights */

  ctx.fillStyle="#ff1744";
  ctx.fillRect(carX-22,y+33,13,8);
  ctx.fillRect(carX+9,y+33,13,8);


  /* body */

  const grad=ctx.createLinearGradient(
    carX-30,y,
    carX+30,y
  );

  grad.addColorStop(0,"#9d1010");
  grad.addColorStop(.45,"#ef3d32");
  grad.addColorStop(1,"#8d0c0c");

  ctx.fillStyle=grad;

  ctx.beginPath();
  ctx.roundRect(carX-31,y-56,62,111,13);
  ctx.fill();


  /* roof */

  ctx.fillStyle="#8d1111";

  ctx.beginPath();
  ctx.roundRect(carX-24,y-42,48,50,10);
  ctx.fill();


  /* rear window */

  const glass=ctx.createLinearGradient(
    0,y-40,
    0,y+8
  );

  glass.addColorStop(0,"#b3ecff");
  glass.addColorStop(1,"#1976a8");

  ctx.fillStyle=glass;

  ctx.beginPath();
  ctx.roundRect(carX-19,y-35,38,29,6);
  ctx.fill();


  /* center line */

  ctx.fillStyle="#ffcc80";
  ctx.fillRect(carX-2,y-1,4,30);


  /* bumper */

  ctx.fillStyle="#444";
  ctx.fillRect(carX-25,y+40,50,7);


  /* wheels */

  ctx.fillStyle="#080808";

  ctx.fillRect(carX-39,y-33,11,31);
  ctx.fillRect(carX+28,y-33,11,31);

  ctx.fillRect(carX-39,y+18,11,31);
  ctx.fillRect(carX+28,y+18,11,31);


  /* wheel rims */

  ctx.fillStyle="#777";

  ctx.fillRect(carX-37,y-25,7,15);
  ctx.fillRect(carX+30,y-25,7,15);
  ctx.fillRect(carX-37,y+25,7,15);
  ctx.fillRect(carX+30,y+25,7,15);
}


/* ZOMBIE */

function spawnZombie(){

  const rw=Math.min(W*.88,520);
  const rx=(W-rw)/2;

  zombies.push({
    x:rx+35+Math.random()*(rw-70),
    y:-65,
    speed:1.4+Math.random()*1.8+Math.min(kills*.012,1.4),
    w:42,
    h:60,
    variant:Math.floor(Math.random()*3)
  });
}


function zombie(z){

  ctx.save();
  ctx.translate(z.x,z.y);

  /* shadow */

  ctx.fillStyle="#0006";

  ctx.beginPath();
  ctx.ellipse(0,31,23,7,0,0,Math.PI*2);
  ctx.fill();


  let skin;

  if(z.variant===0)skin="#69a94d";
  else if(z.variant===1)skin="#8eaa55";
  else skin="#4f8f45";


  /* legs */

  ctx.strokeStyle="#283c29";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-9,25);
  ctx.lineTo(-13,42);
  ctx.moveTo(9,25);
  ctx.lineTo(13,42);
  ctx.stroke();


  /* body */

  ctx.fillStyle=
    z.variant===1 ? "#765f48" : "#395c42";

  ctx.beginPath();
  ctx.roundRect(-19,-4,38,38,8);
  ctx.fill();


  /* arms */

  ctx.strokeStyle=skin;
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(-17,0);
  ctx.lineTo(-31,15);
  ctx.moveTo(17,0);
  ctx.lineTo(31,15);
  ctx.stroke();


  /* head */

  ctx.fillStyle=skin;

  ctx.beginPath();
  ctx.arc(0,-23,19,0,Math.PI*2);
  ctx.fill();


  /* hair */

  ctx.fillStyle="#263328";

  ctx.beginPath();
  ctx.arc(0,-33,16,Math.PI,Math.PI*2);
  ctx.fill();


  /* eyes */

  ctx.fillStyle="#160d0d";

  ctx.fillRect(-9,-27,5,6);
  ctx.fillRect(4,-27,5,6);


  /* mouth */

  ctx.fillStyle="#eee";

  ctx.fillRect(-9,-13,18,5);


  ctx.restore();
}


/* SHOOT */

function shoot(){

  bullets.push({
    x:carX,
    y:H-205,
    speed:14
  });

  for(let i=0;i<5;i++){

    particles.push({
      x:carX+(Math.random()-.5)*12,
      y:H-205,
      vx:(Math.random()-.5)*3,
      vy:-Math.random()*4,
      life:12,
      type:"flash"
    });
  }
}


/* BULLETS */

function bulletDraw(){

  bullets.forEach(b=>{

    ctx.shadowBlur=15;
    ctx.shadowColor="#ffcf33";

    ctx.fillStyle="#ffd740";

    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;
  });
}


/* PARTICLES */

function burst(x,y){

  for(let i=0;i<18;i++){

    particles.push({
      x:x,
      y:y,
      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,
      life:25+Math.random()*15,
      type:"hit"
    });
  }
}


function particlesDraw(dt){

  particles.forEach(p=>{

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;

    ctx.globalAlpha=Math.max(0,p.life/30);

    ctx.fillStyle=
      p.type==="flash"
      ? "#fff176"
      : "#ff7043";

    ctx.fillRect(p.x,p.y,5,5);
  });

  ctx.globalAlpha=1;

  particles=particles.filter(p=>p.life>0);
}


/* COLLISION */

function hit(a,b){

  return Math.abs(a.x-b.x)<
    (a.w+b.w)/2 &&
    Math.abs(a.y-b.y)<
    (a.h+b.h)/2;
}


/* GAME OVER */

function gameOver(){

  running=false;

  document.getElementById("finalKills").textContent=kills;
  document.getElementById("gameOver").classList.remove("hidden");
}


/* LOOP */

function loop(t){

  if(!running)return;

  const dt=Math.min(
    (t-last)/16.67,
    2
  );

  last=t;


  /* movement */

  if(leftDown)carX-=7*dt;
  if(rightDown)carX+=7*dt;


  const rw=Math.min(W*.88,520);
  const rx=(W-rw)/2;

  carX=Math.max(
    rx+45,
    Math.min(rx+rw-45,carX)
  );


  /* shooting */

  fireTimer-=dt;

  if(fireDown && fireTimer<=0){

    shoot();
    fireTimer=9;
  }


  /* spawn */

  spawnTimer-=dt;

  if(spawnTimer<=0){

    spawnZombie();

    spawnTimer=Math.max(
      20,
      52-kills*.22
    );
  }


  /* move zombies */

  zombies.forEach(z=>{
    z.y+=z.speed*dt;
  });


  /* move bullets */

  bullets.forEach(b=>{
    b.y-=b.speed*dt;
  });


  bullets=bullets.filter(
    b=>b.y>-30
  );


  /* collision */

  for(let i=zombies.length-1;i>=0;i--){

    const z=zombies[i];

    let dead=false;


    for(let j=bullets.length-1;j>=0;j--){

      const b=bullets[j];

      if(
        Math.abs(b.x-z.x)<27 &&
        Math.abs(b.y-z.y)<38
      ){

        bullets.splice(j,1);
        zombies.splice(i,1);

        kills++;
        coins+=5;

        burst(z.x,z.y);

        hud();

        dead=true;

        break;
      }
    }

    if(dead)continue;


    /* car collision */

    if(
      hit(
        {
          x:carX,
          y:H-145,
          w:55,
          h:95
        },
        z
      )
    ){

      zombies.splice(i,1);

      hp-=20;

      burst(z.x,z.y);

      hud();

      if(hp<=0){

        hp=0;
        hud();

        gameOver();

        return;
      }

      continue;
    }


    if(z.y>H+80){

      zombies.splice(i,1);
    }
  }


  /* DRAW */

  road();

  zombies.forEach(zombie);

  car();

  bulletDraw();

  particlesDraw(dt);


  requestAnimationFrame(loop);
}

resize();

</script>

</body>
</html>
