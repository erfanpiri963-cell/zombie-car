<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Car</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0d;font-family:Arial,sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font-family:inherit;cursor:pointer}
#startScreen,#gameOver{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000d;padding:18px}
#gameOver{display:none}
.card{width:min(430px,94vw);padding:26px;border-radius:26px;background:linear-gradient(150deg,#242b30,#101416);text-align:center;box-shadow:0 20px 70px #000;border:1px solid #ffffff18}
.logo{font-size:58px}.card h1{font-size:34px;margin:8px 0}.card p{color:#c7d0d5}
.mainBtn{width:100%;padding:15px;border:0;border-radius:15px;background:#f57c00;color:#fff;font-size:20px;font-weight:900}
.hud{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#000b;border:1px solid #ffffff18;border-radius:12px;padding:7px 10px;font-weight:900;font-size:13px}
#missionBtn,#weaponBtn{position:fixed;z-index:30;border:0;border-radius:13px;color:#fff;font-weight:900;padding:10px 13px;box-shadow:0 5px 18px #0008}
#missionBtn{right:12px;top:70px;background:#1b5e20}#weaponBtn{right:12px;top:120px;background:#6a1b9a}
.panel{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:#000b;padding:16px}.panel.show{display:flex}
.box{width:min(470px,95vw);max-height:85vh;overflow:auto;background:#15191c;border-radius:22px;padding:16px;border:1px solid #ffffff18}
.head{display:flex;justify-content:space-between;align-items:center}.close{background:#343a40;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:20px}
.row{padding:13px;margin:9px 0;border-radius:16px;background:#ffffff09;border:1px solid #ffffff12}.row b{font-size:16px}.small{display:block;color:#9eabb2;font-size:12px;margin:5px 0 9px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.line button{border:0;border-radius:10px;padding:8px 10px;background:#2e7d32;color:#fff;font-weight:900}.line button:disabled{background:#444;color:#888}
.weapon.active{border-color:#ab47bc;background:#ab47bc16}.weapon .line button{background:#6a1b9a}
#bossBar{position:fixed;left:12%;right:12%;top:62px;height:12px;background:#311;border-radius:9px;overflow:hidden;display:none;z-index:25}#bossFill{height:100%;width:100%;background:#e53935}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div class="badge">🪙 <span id="coins">0</span> · ☠️ <span id="kills">0</span></div><div class="badge">مرحله <span id="stage">1</span> · ❤️ <span id="hp">100</span></div></div>
<div id="weaponHud" class="badge" style="position:fixed;left:10px;top:58px;z-index:25">🔫 مسلسل · سطح 1</div>
<div id="bossBar"><div id="bossFill"></div></div>
<button id="missionBtn">🎯 مأموریت‌ها</button><button id="weaponBtn">🔫 اسلحه‌ها</button>

<div id="missionPanel" class="panel"><div class="box"><div class="head"><h2>🎯 مأموریت‌ها</h2><button class="close" id="missionClose">✕</button></div><div id="missionList"></div></div></div>
<div id="weaponPanel" class="panel"><div class="box"><div class="head"><h2>🔫 اسلحه‌ها</h2><button class="close" id="weaponClose">✕</button></div><div id="weaponList"></div></div></div>

<div id="startScreen"><div class="card"><div class="logo">🧟‍♂️🚗</div><h1>Zombie Car</h1><p>زامبی‌ها را نابود کن، سکه جمع کن و ماشینت را قوی‌تر کن!</p><button class="mainBtn" id="startGame">▶️ شروع بازی</button></div></div>
<div id="gameOver"><div class="card"><div class="logo">💥🚗</div><h1>باختی!</h1><p>امتیاز: <b id="finalScore">0</b></p><button class="mainBtn" id="restart">🔄 دوباره بازی کن</button></div></div>
<script src="game.js"></script>
</body></html>
