<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Car</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div>❤️ <span id="hp">100</span></div>
  <div>🪙 <span id="coins">0</span></div>
  <div>☠️ <span id="kills">0</span></div>
</div>

<div id="stage">مرحله <span id="stageNum">1</span></div>
<div id="bossBar" class="hidden"><div id="bossName">👑 باس زامبی</div><div class="boss-track"><div id="bossHpBar"></div></div><span id="bossHpText">0 / 0</span></div>
<button id="shopBtn">🛒 فروشگاه</button>

<canvas id="game"></canvas>

<div id="controls">
  <button id="left">◀</button>
  <button id="fire">🔫</button>
  <button id="right">▶</button>
</div>

<div id="shop" class="hidden">
  <div class="shop-panel">
    <div class="shop-head">
      <h2>🛒 فروشگاه</h2>
      <button id="closeShop">✕</button>
    </div>
    <div class="shop-coins">🪙 سکه: <b id="shopCoins">0</b></div>
    <button id="resetSave" class="reset-save">🗑️ پاک کردن پیشرفت ذخیره‌شده</button>

    <div class="upgrade" id="upgradeHp">
      <div class="icon">❤️</div>
      <div class="info"><b>جان</b><small>حداکثر جان +25</small><span>سطح <b id="hpLevel">0</b></span></div>
      <button class="buy" data-upgrade="hp"><span id="hpCost">30</span> 🪙</button>
    </div>

    <div class="upgrade" id="upgradeSpeed">
      <div class="icon">🚗</div>
      <div class="info"><b>سرعت ماشین</b><small>حرکت سریع‌تر</small><span>سطح <b id="speedLevel">0</b></span></div>
      <button class="buy" data-upgrade="speed"><span id="speedCost">40</span> 🪙</button>
    </div>

    <div class="upgrade" id="upgradeFire">
      <div class="icon">🔫</div>
      <div class="info"><b>سرعت شلیک</b><small>تیراندازی سریع‌تر</small><span>سطح <b id="fireLevel">0</b></span></div>
      <button class="buy" data-upgrade="fire"><span id="fireCost">45</span> 🪙</button>
    </div>

    <div class="upgrade" id="upgradeDamage">
      <div class="icon">💥</div>
      <div class="info"><b>قدرت تیر</b><small>آسیب بیشتر به زامبی</small><span>سطح <b id="damageLevel">0</b></span></div>
      <button class="buy" data-upgrade="damage"><span id="damageCost">60</span> 🪙</button>
    </div>

    <div class="upgrade" id="upgradeArmor">
      <div class="icon">🛡️</div>
      <div class="info"><b>زره</b><small>کاهش آسیب برخورد</small><span>سطح <b id="armorLevel">0</b></span></div>
      <button class="buy" data-upgrade="armor"><span id="armorCost">70</span> 🪙</button>
    </div>
  </div>
</div>

<div id="gameover" class="hidden">
  <h1>💀 باختی!</h1>
  <p>مرحله: <b id="finalStage">1</b></p>
  <p>زامبی‌های کشته‌شده: <b id="finalKills">0</b></p>
  <button id="restart">دوباره بازی کن</button>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="game.js"></script>
</body>
</html>
