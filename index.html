<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>Zombie Car — Realistic Edition</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .stat {
      background: #090d11dd;
      border: 1px solid #ffffff25;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 900;
      box-shadow: 0 5px 18px #0009;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      pointer-events: none;
    }

    .ctrl {
      pointer-events: auto;
      width: 72px;
      height: 64px;
      border: 2px solid #ffffff30;
      border-radius: 18px;
      background: linear-gradient(#30373d, #07090b);
      color: white;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 8px 24px #000b;
      touch-action: none;
    }

    #fire {
      width: 98px;
      height: 88px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 25%,
          #ffad63,
          #a5180d 72%
        );
      font-size: 19px;
    }

    #start,
    #over {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: linear-gradient(#000b, #05080dee);
    }

    #over {
      display: none;
    }

    .card {
      width: min(430px, 94vw);
      padding: 28px;
      text-align: center;
      background: linear-gradient(
        150deg,
        #151b20ee,
        #05070aeF
      );
      border: 1px solid #d3a42d66;
      border-radius: 20px;
      box-shadow: 0 30px 100px #000;
    }

    .card h1 {
      font-size: 38px;
      margin: 0 0 8px;
    }

    .gold {
      color: #dfac1d;
    }

    .sub {
      color: #9da8ae;
      margin-bottom: 20px;
    }

    .startBtn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(#d4a514, #8b6200);
      color: white;
      font-size: 20px;
      font-weight: 900;
    }
  </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>
    <span class="stat">
      🪙 <b id="coins">0</b>
    </span>

    <span class="stat">
      ☠️ <b id="kills">0</b>
    </span>
  </div>

  <div>
    <span class="stat">
      ❤️ <b id="hp">100</b>
    </span>

    <span class="stat">
      مرحله <b id="stage">1</b>
    </span>
  </div>
</div>

<div id="controls">

  <button class="ctrl" id="left">
    ◀
  </button>

  <button class="ctrl" id="fire">
    🔥
    <br>
    <small>تیر</small>
  </button>

  <button class="ctrl" id="right">
    ▶
  </button>

</div>

<div id="start">
  <div class="card">

    <div style="font-size:60px">
      🚗💥
    </div>

    <h1>
      ZOMBIE
      <span class="gold">CAR</span>
    </h1>

    <div class="sub">
      REALISTIC APOCALYPSE EDITION
    </div>

    <button class="startBtn" id="startBtn">
      ▶ شروع عملیات
    </button>

  </div>
</div>

<div id="over">
  <div class="card">

    <h1>
      ماموریت شکست خورد
    </h1>

    <div class="sub">
      امتیاز:
      <b id="final">0</b>
    </div>

    <button
      class="startBtn"
      onclick="location.reload()">
      🔄 دوباره
    </button>

  </div>
</div>

<script src="game.js"></script>

</body>
</html>
