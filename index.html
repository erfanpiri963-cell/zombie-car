<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Zombie Car</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0f12;
    font-family:Arial,sans-serif;
    touch-action:none;
}

.hidden{display:none!important}

/* MENU */

#menuScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 35%,#454d54,#1b2025 45%,#080a0c);
    color:white;
}

.logo{
    font-size:clamp(34px,10vw,58px);
    font-weight:900;
    text-align:center;
    text-shadow:0 4px 0 #000,0 8px 25px rgba(0,0,0,.8);
    margin-bottom:12px;
}

.subtitle{
    color:#bfc5c9;
    font-size:16px;
    margin-bottom:42px;
}

#startBtn{
    border:0;
    padding:18px 55px;
    border-radius:18px;
    background:linear-gradient(#f44336,#c62828);
    color:white;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.55);
}

#startBtn:active{transform:scale(.94)}

/* GAME */

#gameScreen{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#111;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* HUD */

#hud{
    position:absolute;
    top:15px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:20;
    pointer-events:none;
}

.hudBox{
    min-width:75px;
    padding:9px 13px;
    border-radius:13px;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.12);
    color:white;
    font-size:17px;
    font-weight:bold;
    text-align:center;
    backdrop-filter:blur(6px);
}

/* CONTROLS */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:25px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    align-items:center;
    z-index:30;
    padding:0 22px;
    direction:ltr;
}

.controlBtn{
    width:78px;
    height:78px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.48);
    color:white;
    font-size:30px;
    font-weight:bold;
    backdrop-filter:blur(7px);
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    touch-action:none;
}

#leftBtn{justify-self:start}
#rightBtn{justify-self:end}

#fireBtn{
    justify-self:center;
    width:88px;
    height:88px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.2);
    background:linear-gradient(#ff7043,#d84315);
    color:white;
    font-size:36px;
    box-shadow:0 7px 22px rgba(0,0,0,.5);
    touch-action:none;
}

.controlBtn:active,
#fireBtn:active{
    transform:scale(.9);
}

/* GAME OVER */

#gameOver{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
    color:white;
    text-align:center;
}

#gameOver h1{
    font-size:42px;
    margin-bottom:15px;
}

#gameOver p{
    color:#ccc;
    margin-bottom:25px;
    font-size:18px;
}

#restartBtn{
    border:0;
    border-radius:14px;
    padding:15px 35px;
    background:#e53935;
    color:white;
    font-size:19px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="menuScreen">

    <div class="logo">
        🚗 ZOMBIE CAR 🧟
    </div>

    <div class="subtitle">
        جاده پر از زامبی شده...
    </div>

    <button id="startBtn">
        ▶ شروع بازی
    </button>

</div>


<div id="gameScreen" class="hidden">

    <canvas id="game"></canvas>

    <div id="hud">

        <div class="hudBox">
            ❤️ <span id="hp">100</span>
        </div>

        <div class="hudBox">
            🪙 <span id="coins">0</span>
        </div>

        <div class="hudBox">
            ☠️ <span id="kills">0</span>
        </div>

    </div>


    <div id="controls">

        <button id="leftBtn" class="controlBtn">
            ◀
        </button>

        <button id="fireBtn">
            🔫
        </button>

        <button id="rightBtn" class="controlBtn">
            ▶
        </button>

    </div>


    <div id="gameOver" class="hidden">

        <h1>💀 باختی!</h1>

        <p>
            زامبی‌های کشته‌شده:
            <b id="finalKills">0</b>
        </p>

        <button id="restartBtn">
            🔄 دوباره بازی کن
        </button>

    </div>

</div>


<script>

const startBtn=document.getElementById("startBtn");
const restartBtn=document.getElementById("restartBtn");

const menuScreen=document.getElementById("menuScreen");
const gameScreen=document.getElementById("gameScreen");

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const leftBtn=document.getElementById("leftBtn");
const rightBtn=document.getElementById("rightBtn");
const fireBtn=document.getElementById("fireBtn");

let W=0;
let H=0;

let carX=0;
let roadOffset=0;

let movingLeft=false;
let movingRight=false;
let firing=false;

let bullets=[];
let zombies=[];
let particles=[];

let running=false;
let lastTime=0;
let fireCooldown=0;
let spawnTimer=0;

let hp=100;
let coins=0;
let kills=0;


/* RESIZE */

function resize(){

    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;

    if(!carX){
        carX=W/2;
    }
}

window.addEventListener("resize",resize);


/* HUD */

function updateHUD(){

    document.getElementById("hp").textContent=Math.max(0,hp);
    document.getElementById("coins").textContent=coins;
    document.getElementById("kills").textContent=kills;
}


/* START */

startBtn.addEventListener("click",startGame);

function startGame(){

    menuScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    document.getElementById("gameOver").classList.add("hidden");

    resize();

    carX=W/2;

    hp=100;
    coins=0;
    kills=0;

    bullets=[];
    zombies=[];
    particles=[];

    roadOffset=0;
    spawnTimer=0;
    fireCooldown=0;

    running=true;

    updateHUD();

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}


/* RESTART */

restartBtn.addEventListener("click",function(){
    startGame();
});


/* BUTTON HOLD */

function holdButton(button,start,end){

    button.addEventListener("pointerdown",function(e){
        e.preventDefault();
        start();
    });

    button.addEventListener("pointerup",function(e){
        e.preventDefault();
        end();
    });

    button.addEventListener("pointercancel",end);
    button.addEventListener("pointerleave",end);
}

holdButton(
    leftBtn,
    ()=>movingLeft=true,
    ()=>movingLeft=false
);

holdButton(
    rightBtn,
    ()=>movingRight=true,
    ()=>movingRight=false
);

holdButton(
    fireBtn,
    ()=>firing=true,
    ()=>firing=false
);


/* KEYBOARD */

window.addEventListener("keydown",function(e){

    if(e.key==="ArrowLeft") movingLeft=true;
    if(e.key==="ArrowRight") movingRight=true;
    if(e.code==="Space") firing=true;
});

window.addEventListener("keyup",function(e){

    if(e.key==="ArrowLeft") movingLeft=false;
    if(e.key==="ArrowRight") movingRight=false;
    if(e.code==="Space") firing=false;
});


/* ROAD */

function drawRoad(){

    ctx.fillStyle="#10151a";
    ctx.fillRect(0,0,W,H);

    const roadWidth=Math.min(W*.88,520);
    const roadX=(W-roadWidth)/2;

    ctx.fillStyle="#363b40";
    ctx.fillRect(roadX,0,roadWidth,H);

    ctx.fillStyle="#aeb4b8";

    ctx.fillRect(roadX,0,5,H);

    ctx.fillRect(
        roadX+roadWidth-5,
        0,
        5,
        H
    );

    ctx.strokeStyle="#eeeeee";
    ctx.lineWidth=5;

    ctx.setLineDash([45,35]);
    ctx.lineDashOffset=roadOffset;

    ctx.beginPath();
    ctx.moveTo(W/2,0);
    ctx.lineTo(W/2,H);
    ctx.stroke();

    ctx.setLineDash([]);

    roadOffset+=4;

    if(roadOffset>80) roadOffset=0;
}


/* CAR */

function drawCar(){

    const y=H-150;

    ctx.fillStyle="rgba(0,0,0,.45)";

    ctx.beginPath();

    ctx.ellipse(
        carX,
        y+47,
        39,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#e53935";

    ctx.beginPath();

    ctx.roundRect(
        carX-30,
        y-55,
        60,
        110,
        12
    );

    ctx.fill();


    ctx.fillStyle="#b71c1c";

    ctx.beginPath();

    ctx.roundRect(
        carX-23,
        y-38,
        46,
        48,
        9
    );

    ctx.fill();


    ctx.fillStyle="#81d4fa";

    ctx.beginPath();

    ctx.roundRect(
        carX-18,
        y-32,
        36,
        27,
        6
    );

    ctx.fill();


    ctx.fillStyle="#ef5350";

    ctx.beginPath();

    ctx.roundRect(
        carX-24,
        y+8,
        48,
        28,
        7
    );

    ctx.fill();


    ctx.fillStyle="#fff59d";

    ctx.fillRect(carX-20,y+32,12,7);
    ctx.fillRect(carX+8,y+32,12,7);


    ctx.fillStyle="#070707";

    ctx.fillRect(carX-38,y-32,10,28);
    ctx.fillRect(carX+28,y-32,10,28);
    ctx.fillRect(carX-38,y+18,10,28);
    ctx.fillRect(carX+28,y+18,10,28);
}


/* ZOMBIE */

function spawnZombie(){

    const roadWidth=Math.min(W*.88,520);
    const roadX=(W-roadWidth)/2;

    const x=
        roadX+
        35+
        Math.random()*
        (roadWidth-70);

    const speed=
        1.4+
        Math.random()*1.5+
        Math.min(kills*.015,1.5);

    zombies.push({
        x:x,
        y:-60,
        w:42,
        h:58,
        speed:speed,
        type:Math.random()
    });
}


function drawZombie(z){

    ctx.save();

    ctx.translate(z.x,z.y);


    /* shadow */

    ctx.fillStyle="rgba(0,0,0,.35)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        28,
        22,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle=
        z.type>.5
        ? "#4caf50"
        : "#388e3c";

    ctx.beginPath();

    ctx.roundRect(
        -19,
        -5,
        38,
        40,
        8
    );

    ctx.fill();


    /* head */

    ctx.fillStyle="#72b95b";

    ctx.beginPath();

    ctx.arc(
        0,
        -22,
        19,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    ctx.fillStyle="#111";

    ctx.fillRect(-9,-26,5,6);
    ctx.fillRect(4,-26,5,6);


    /* mouth */

    ctx.fillStyle="#eee";

    ctx.fillRect(
        -9,
        -12,
        18,
        5
    );


    /* arms */

    ctx.strokeStyle="#72b95b";
    ctx.lineWidth=7;
    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(-17,3);
    ctx.lineTo(-29,16);

    ctx.moveTo(17,3);
    ctx.lineTo(29,16);

    ctx.stroke();


    ctx.restore();
}


/* SHOOT */

function shoot(){

    bullets.push({

        x:carX,

        y:H-210,

        speed:13

    });
}


/* BULLETS */

function updateBullets(dt){

    bullets.forEach(function(b){
        b.y-=b.speed*dt;
    });

    bullets=
        bullets.filter(
            b=>b.y>-30
        );
}


function drawBullets(){

    bullets.forEach(function(b){

        ctx.shadowBlur=12;
        ctx.shadowColor="#ffd54f";

        ctx.fillStyle="#ffd54f";

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;
    });
}


/* PARTICLES */

function burst(x,y){

    for(let i=0;i<10;i++){

        particles.push({

            x:x,
            y:y,

            vx:(Math.random()-.5)*6,
            vy:(Math.random()-.5)*6,

            life:25

        });
    }
}


function updateParticles(dt){

    particles.forEach(function(p){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.life-=dt;

    });

    particles=
        particles.filter(
            p=>p.life>0
        );
}


function drawParticles(){

    particles.forEach(function(p){

        ctx.globalAlpha=p.life/25;

        ctx.fillStyle="#ff7043";

        ctx.fillRect(
            p.x,
            p.y,
            5,
            5
        );

    });

    ctx.globalAlpha=1;
}


/* COLLISION */

function collision(a,b){

    return Math.abs(a.x-b.x)<(a.w+b.w)/2 &&
           Math.abs(a.y-b.y)<(a.h+b.h)/2;
}


/* GAME OVER */

function endGame(){

    running=false;

    document.getElementById(
        "finalKills"
    ).textContent=kills;

    document.getElementById(
        "gameOver"
    ).classList.remove("hidden");
}


/* GAME LOOP */

function gameLoop(time){

    if(!running)return;

    const dt=
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;


    /* movement */

    if(movingLeft){
        carX-=7*dt;
    }

    if(movingRight){
        carX+=7*dt;
    }


    /* road limits */

    const roadWidth=Math.min(W*.88,520);
    const roadX=(W-roadWidth)/2;

    carX=Math.max(
        roadX+45,
        Math.min(
            roadX+roadWidth-45,
            carX
        )
    );


    /* shooting */

    fireCooldown-=dt;

    if(
        firing &&
        fireCooldown<=0
    ){

        shoot();

        fireCooldown=9;
    }


    /* zombies */

    spawnTimer-=dt;

    if(spawnTimer<=0){

        spawnZombie();

        spawnTimer=
            Math.max(
                22,
                55-kills*.25
            );
    }


    zombies.forEach(function(z){

        z.y+=z.speed*dt;

    });


    updateBullets(dt);
    updateParticles(dt);


    /* bullet vs zombie */

    for(
        let i=zombies.length-1;
        i>=0;
        i--
    ){

        const z=zombies[i];

        let killed=false;

        for(
            let j=bullets.length-1;
            j>=0;
            j--
        ){

            const b=bullets[j];

            if(
                Math.abs(b.x-z.x)<25 &&
                Math.abs(b.y-z.y)<35
            ){

                bullets.splice(j,1);
                zombies.splice(i,1);

                kills++;
                coins+=5;

                burst(z.x,z.y);

                updateHUD();

                killed=true;

                break;
            }
        }

        if(killed) continue;


        /* zombie hits car */

        if(
            collision(
                {
                    x:carX,
                    y:H-150,
                    w:55,
                    h:95
                },
                z
            )
        ){

            zombies.splice(i,1);

            hp-=20;

            burst(z.x,z.y);

            updateHUD();

            if(hp<=0){

                hp=0;

                updateHUD();

                endGame();

                return;
            }
        }


        /* zombie leaves screen */

        else if(z.y>H+70){

            zombies.splice(i,1);

        }
    }


    /* DRAW */

    drawRoad();

    zombies.forEach(drawZombie);

    drawCar();

    drawBullets();

    drawParticles();


    requestAnimationFrame(gameLoop);
}

</script>

</body>
</html>
