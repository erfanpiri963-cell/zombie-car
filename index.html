<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Zombie Car</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050608;
    color:#fff;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#090b0d;
}


/* =========================================
   BACKGROUND
========================================= */

#background{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.20),
            rgba(0,0,0,.72)
        ),
        radial-gradient(
            circle at 50% 65%,
            #51504a 0%,
            #242628 32%,
            #111416 70%,
            #060708 100%
        );
}

.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:58%;

    background:
        linear-gradient(
            90deg,
            transparent 0 5%,
            #15191b 5% 10%,
            transparent 10% 14%,
            #101416 14% 20%,
            transparent 20% 25%,
            #171b1d 25% 31%,
            transparent 31% 37%,
            #111416 37% 45%,
            transparent 45% 51%,
            #171b1c 51% 58%,
            transparent 58% 64%,
            #101315 64% 72%,
            transparent 72% 78%,
            #181b1d 78% 85%,
            transparent 85% 90%,
            #101315 90% 100%
        );

    opacity:.9;
}

.smoke{
    position:absolute;
    border-radius:50%;
    filter:blur(18px);
    background:#050505;
    opacity:.6;
}

.smoke.one{
    width:190px;
    height:250px;
    left:23%;
    top:5%;
}

.smoke.two{
    width:240px;
    height:280px;
    right:8%;
    top:8%;
}

.fire{
    position:absolute;
    width:30px;
    height:70px;
    bottom:28%;
    background:
        radial-gradient(
            ellipse,
            #fff 0 8%,
            #ffd13c 18%,
            #ff681d 42%,
            transparent 72%
        );
    filter:blur(2px);
    animation:fire 0.5s infinite alternate;
}

.fire.one{
    left:28%;
}

.fire.two{
    right:27%;
}

@keyframes fire{
    from{
        transform:scaleY(.85) rotate(-3deg);
    }

    to{
        transform:scaleY(1.15) rotate(4deg);
    }
}


/* =========================================
   TOP BAR
========================================= */

#topbar{
    position:absolute;
    top:10px;
    left:15px;
    right:15px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:30;
}

.player{
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:58px;
    height:58px;
    border:1px solid #888;
    border-radius:4px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #a98a69 0 15%,
            #3b3028 16% 35%,
            #111 36%
        );

    box-shadow:
        0 0 0 2px #111,
        0 4px 20px #000;
}

.playerInfo{
    min-width:220px;
}

.playerName{
    font-weight:900;
    font-size:18px;
    letter-spacing:1px;
}

.level{
    font-size:14px;
    color:#ddd;
}

.xpbar{
    height:7px;
    width:220px;
    background:#17191a;
    border:1px solid #555;
    margin-top:4px;
}

.xpfill{
    height:100%;
    width:56%;
    background:#dba91d;
}

.xptext{
    font-size:11px;
    color:#ffc928;
    text-align:center;
}

.resources{
    display:flex;
    gap:10px;
}

.resource{
    min-width:140px;
    height:44px;

    padding:0 12px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    background:#07090be8;
    border:1px solid #292d31;
    border-radius:4px;

    box-shadow:
        0 5px 15px #0008;
}

.resource b{
    font-size:18px;
}

.plus{
    color:#39d54c;
    font-size:25px;
    font-weight:900;
}


/* =========================================
   MAIN MENU
========================================= */

#menu{
    position:absolute;

    top:105px;
    left:18px;

    width:290px;

    z-index:20;
}

.menuBtn{
    width:100%;
    height:65px;

    margin-bottom:5px;

    border:1px solid #3a3d3f;

    background:
        linear-gradient(
            90deg,
            #08090aee,
            #17191ae8
        );

    color:#fff;

    display:flex;
    align-items:center;

    text-align:left;

    padding:5px 14px;

    box-shadow:
        0 5px 14px #0009;

    position:relative;
}

.menuBtn:hover,
.menuBtn.active{
    border-color:#e3af20;

    background:
        linear-gradient(
            90deg,
            #5b4308,
            #171717
        );
}

.menuIcon{
    width:50px;
    font-size:30px;
    text-align:center;
}

.menuText{
    flex:1;
}

.menuEnglish{
    display:block;
    font-size:22px;
    font-weight:900;
}

.menuPersian{
    display:block;
    font-size:14px;
    color:#ddd;
}

.notification{
    position:absolute;
    right:-5px;
    top:-6px;

    width:25px;
    height:25px;

    display:grid;
    place-items:center;

    background:#e50000;
    color:#fff;

    font-weight:900;
}


/* =========================================
   PLAY CARD
========================================= */

#playCard{
    position:absolute;

    left:18px;
    top:105px;

    width:290px;
    height:85px;

    z-index:21;

    border:2px solid #d9a818;

    background:
        linear-gradient(
            90deg,
            #241b05dd,
            #151515e8
        );

    box-shadow:
        0 0 25px #000;
}

#playCard .big{
    font-size:29px;
    font-weight:900;
    color:#eab82a;
    text-align:center;
}

#playCard .small{
    text-align:center;
    font-size:16px;
}


/* =========================================
   DAILY MISSION
========================================= */

#dailyMission{
    position:absolute;

    top:90px;
    right:18px;

    width:270px;

    padding:15px;

    z-index:25;

    background:
        linear-gradient(
            135deg,
            #101315f4,
            #070808f4
        );

    border:1px solid #3c3f40;

    box-shadow:
        0 8px 30px #000b;
}

.dailyTitle{
    font-size:19px;
    font-weight:900;
    margin-bottom:12px;
}

.dailyTask{
    font-size:15px;
    margin-bottom:8px;
}

.progress{
    height:12px;
    background:#17191a;
    border:1px solid #4a4a4a;
    overflow:hidden;
}

.progressFill{
    height:100%;
    width:64%;
    background:
        linear-gradient(
            90deg,
            #dca916,
            #ffc83e
        );
}

.rewards{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    color:#ddd;
}


/* =========================================
   STAGE CARD
========================================= */

#stageCard{
    position:absolute;

    right:18px;
    bottom:18px;

    width:270px;

    z-index:25;

    background:#090b0deF;
    border:1px solid #373b3e;

    box-shadow:
        0 8px 25px #000;
}

.stageImage{
    height:125px;

    background:
        linear-gradient(#0004,#0008),
        radial-gradient(
            circle at 50% 70%,
            #a24b1f,
            #20272a 35%,
            #101316 70%
        );

    display:flex;
    align-items:flex-start;
    justify-content:center;

    padding-top:10px;

    font-size:18px;
    font-weight:900;
    color:#e21b1b;
}

.stageTitle{
    text-align:center;
    font-size:26px;
    font-weight:900;
    margin-top:-2px;
}

.playRed{
    width:100%;
    height:58px;

    border:1px solid #8d0000;

    background:
        linear-gradient(
            #f22920,
            #7d0000
        );

    color:white;

    font-size:27px;
    font-weight:900;
}


/* =========================================
   BOTTOM BUTTONS
========================================= */

#bottomButtons{
    position:absolute;

    left:18px;
    bottom:20px;

    z-index:30;

    display:flex;
    gap:10px;
}

.bottomBtn{
    width:100px;
    height:75px;

    border:1px solid #d6a617;

    background:#0a0c0df0;

    color:#fff;

    font-size:15px;

    box-shadow:
        0 6px 20px #000;
}

.bottomIcon{
    display:block;
    font-size:30px;
    margin-bottom:4px;
}


/* =========================================
   GAME SCREEN
========================================= */

#gameScreen{
    position:absolute;
    inset:0;

    display:none;

    background:#080a0b;

    z-index:100;
}

#gameCanvas{
    width:100%;
    height:100%;
    display:block;
}

#gameHUD{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.gameStat{
    background:#050708d9;
    border:1px solid #555;
    padding:8px 12px;
    margin:2px;

    font-weight:900;
}

#gameControls{
    position:absolute;

    bottom:20px;
    left:20px;
    right:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.control{
    pointer-events:auto;

    width:78px;
    height:70px;

    border-radius:50%;

    border:2px solid #666;

    background:
        radial-gradient(
            circle,
            #25282b,
            #050607
        );

    color:white;

    font-size:30px;
}

.fireButton{
    width:100px;
    height:100px;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffb84d,
            #d22216 50%,
            #710000
        );

    border-color:#ffbd33;

    font-size:38px;
}

#backGame{
    pointer-events:auto;

    position:absolute;

    top:10px;
    left:50%;

    transform:translateX(-50%);

    background:#080909dd;
    color:white;

    border:1px solid #aaa;

    padding:8px 20px;
}


/* =========================================
   MODAL
========================================= */

.modal{
    position:absolute;

    inset:0;

    z-index:200;

    display:none;

    place-items:center;

    background:#000b;
}

.modalBox{
    width:min(850px,94vw);
    max-height:88vh;
    overflow:auto;

    padding:25px;

    background:
        linear-gradient(
            135deg,
            #171a1c,
            #070809
        );

    border:1px solid #bd9219;

    box-shadow:
        0 30px 100px #000;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #444;

    padding-bottom:12px;
    margin-bottom:15px;
}

.modalHeader h2{
    margin:0;
}

.close{
    width:40px;
    height:40px;

    background:#300;
    color:#fff;

    border:1px solid #900;

    font-size:22px;
}

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px,1fr)
        );

    gap:12px;
}

.card{
    padding:14px;

    border:1px solid #404448;

    background:
        linear-gradient(
            135deg,
            #171a1c,
            #090a0b
        );
}

.card h3{
    margin-top:0;
    color:#e4b323;
}

.cardButton{
    width:100%;

    padding:10px;

    background:
        linear-gradient(
            #459b36,
            #1c5a18
        );

    color:white;

    border:1px solid #5ebc4d;

    font-weight:900;
}

.locked{
    opacity:.5;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

    #menu{
        width:220px;
    }

    .menuBtn{
        height:55px;
    }

    .menuEnglish{
        font-size:17px;
    }

    .menuPersian{
        font-size:11px;
    }

    .menuIcon{
        width:40px;
        font-size:24px;
    }

    #dailyMission{
        width:225px;
    }

    #stageCard{
        width:220px;
    }

    .resources{
        gap:4px;
    }

    .resource{
        min-width:100px;
    }

}

@media(max-width:650px){

    #topbar{
        transform:scale(.78);
        transform-origin:top right;
    }

    #menu{
        top:95px;
        left:8px;
        width:180px;
    }

    #playCard{
        left:8px;
        top:95px;
        width:180px;
    }

    #dailyMission{
        top:95px;
        right:8px;
        width:170px;
        font-size:11px;
    }

    #stageCard{
        right:8px;
        bottom:8px;
        width:180px;
    }

    #bottomButtons{
        left:8px;
        bottom:8px;
    }

    .bottomBtn{
        width:75px;
        height:60px;
        font-size:11px;
    }

    .bottomIcon{
        font-size:22px;
    }

}

</style>
</head>


<body>

<div id="app">

<div id="background">
    <div class="city"></div>
    <div class="smoke one"></div>
    <div class="smoke two"></div>
    <div class="fire one"></div>
    <div class="fire two"></div>
</div>


<!-- ======================================
     TOP
======================================= -->

<div id="topbar">

    <div class="player">

        <div class="avatar"></div>

        <div class="playerInfo">

            <div class="playerName">
                PLAYER
            </div>

            <div class="level">
                LVL 23
            </div>

            <div class="xpbar">
                <div class="xpfill"></div>
            </div>

            <div class="xptext">
                8,450 / 15,000
            </div>

        </div>

    </div>


    <div class="resources">

        <div class="resource">
            🪙
            <b id="coins">56,320</b>
            <span class="plus">+</span>
        </div>

        <div class="resource">
            💎
            <b>1,250</b>
            <span class="plus">+</span>
        </div>

        <div class="resource">
            🎒
            <b>42/50</b>
            <span class="plus">+</span>
        </div>

        <button
            class="resource"
            onclick="openModal('settings')">
            ⚙️
        </button>

    </div>

</div>


<!-- ======================================
     MENU
======================================= -->

<div id="menu">

    <button
        class="menuBtn active"
        onclick="startGame()">

        <span class="menuIcon">▶</span>

        <span class="menuText">

            <span class="menuEnglish">
                PLAY
            </span>

            <span class="menuPersian">
                16 مرحله
            </span>

        </span>

    </button>


    <button
        class="menuBtn"
        onclick="openModal('weapons')">

        <span class="menuIcon">🔫</span>

        <span class="menuText">

            <span class="menuEnglish">
                WEAPONS
            </span>

            <span class="menuPersian">
                اسلحه ها
            </span>

        </span>

    </button>


    <button
        class="menuBtn"
        onclick="openModal('garage')">

        <span class="menuIcon">🚘</span>

        <span class="menuText">

            <span class="menuEnglish">
                GARAGE
            </span>

            <span class="menuPersian">
                ماشین
            </span>

        </span>

    </button>


    <button
        class="menuBtn"
        onclick="openModal('missions')">

        <span class="menuIcon">🎯</span>

        <span class="menuText">

            <span class="menuEnglish">
                MISSIONS
            </span>

            <span class="menuPersian">
                مأموریت ها
            </span>

        </span>

        <span class="notification">
            !
        </span>

    </button>


    <button
        class="menuBtn"
        onclick="openModal('shop')">

        <span class="menuIcon">🛒</span>

        <span class="menuText">

            <span class="menuEnglish">
                SHOP
            </span>

            <span class="menuPersian">
                فروشگاه
            </span>

        </span>

    </button>


    <button
        class="menuBtn"
        onclick="openModal('settings')">

        <span class="menuIcon">⚙️</span>

        <span class="menuText">

            <span class="menuEnglish">
                SETTINGS
            </span>

            <span class="menuPersian">
                تنظیمات
            </span>

        </span>

    </button>

</div>


<!-- ======================================
     DAILY
======================================= -->

<div id="dailyMission">

    <div class="dailyTitle">
        مأموریت روزانه
    </div>

    <div class="dailyTask">
        🧟 50 زامبی را بکش
    </div>

    <div class="progress">
        <div
            id="dailyProgress"
            class="progressFill">
        </div>
    </div>

    <div class="rewards">

        <span>
            💎 10
        </span>

        <span>
            🪙 2,000
        </span>

    </div>

</div>


<!-- ======================================
     STAGE
======================================= -->

<div id="stageCard">

    <div class="stageImage">
        STAGE 16
    </div>

    <div class="stageTitle">
        شهر متروکه
    </div>

    <button
        class="playRed"
        onclick="startGame()">
        PLAY
    </button>

</div>


<!-- ======================================
     BOTTOM
======================================= -->

<div id="bottomButtons">

    <button
        class="bottomBtn"
        onclick="claimGift()">

        <span class="bottomIcon">
            🎁
        </span>

        هدیه رایگان

    </button>


    <button
        class="bottomBtn"
        onclick="openModal('shop')">

        <span class="bottomIcon">
            📦
        </span>

        صندوقچه

    </button>

</div>


<!-- ======================================
     GAME
======================================= -->

<div id="gameScreen">

    <canvas id="gameCanvas"></canvas>


    <div id="gameHUD">

        <div>

            <span class="gameStat">
                ❤️ <b id="gameHP">100</b>
            </span>

            <span class="gameStat">
                ☠️ <b id="gameKills">0</b>
            </span>

        </div>


        <div>

            <span class="gameStat">
                STAGE <b id="gameStage">1</b>
            </span>

            <span class="gameStat">
                🪙 <b id="gameCoins">0</b>
            </span>

        </div>

    </div>


    <button
        id="backGame"
        onclick="exitGame()">
        خروج
    </button>


    <div id="gameControls">

        <button
            class="control"
            id="leftBtn">
            ◀
        </button>

        <button
            class="control fireButton"
            id="fireBtn">
            🔥
        </button>

        <button
            class="control"
            id="rightBtn">
            ▶
        </button>

    </div>

</div>


<!-- ======================================
     MODALS
======================================= -->

<div
    id="modal"
    class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <h2 id="modalTitle">
                عنوان
            </h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>

        <div id="modalContent"></div>

    </div>

</div>


<script>


/* =====================================================
   GAME DATA
===================================================== */

const gameData = {

    coins:56320,

    diamonds:1250,

    xp:8450,

    level:23,

    stage:16,

    weapons:[

        {
            name:"MACHINE GUN",
            level:5,
            damage:70,
            fireRate:8,
            price:7500,
            icon:"🔫"
        },

        {
            name:"SHOTGUN",
            level:4,
            damage:110,
            fireRate:4,
            price:6000,
            icon:"🔫"
        },

        {
            name:"LASER GUN",
            level:3,
            damage:150,
            fireRate:10,
            price:5000,
            icon:"⚡"
        },

        {
            name:"ROCKET LAUNCHER",
            level:2,
            damage:240,
            fireRate:2,
            price:8000,
            icon:"🚀"
        }

    ],

    missions:[

        {
            name:"Zombie Hunter",
            description:"50 زامبی را بکش",
            progress:32,
            target:50,
            rewardCoins:2000,
            rewardDiamonds:10
        },

        {
            name:"Road Warrior",
            description:"۵ دقیقه زنده بمان",
            progress:2,
            target:5,
            rewardCoins:3500,
            rewardDiamonds:15
        },

        {
            name:"Heavy Damage",
            description:"10000 آسیب وارد کن",
            progress:6400,
            target:10000,
            rewardCoins:5000,
            rewardDiamonds:20
        }

    ]

};


/* =====================================================
   UI
===================================================== */

const modal =
    document.getElementById("modal");

const modalTitle =
    document.getElementById("modalTitle");

const modalContent =
    document.getElementById("modalContent");


function openModal(type){

    modal.style.display="grid";

    if(type==="weapons"){
        showWeapons();
    }

    if(type==="garage"){
        showGarage();
    }

    if(type==="missions"){
        showMissions();
    }

    if(type==="shop"){
        showShop();
    }

    if(type==="settings"){
        showSettings();
    }

}


function closeModal(){

    modal.style.display="none";

}


/* =====================================================
   WEAPONS
===================================================== */

function showWeapons(){

    modalTitle.textContent =
        "🔫 WEAPONS — اسلحه‌ها";

    modalContent.innerHTML = `

        <div class="grid">

            ${gameData.weapons.map(
                (weapon,index)=>`

                <div class="card">

                    <div
                        style="
                        font-size:55px;
                        text-align:center;
                        padding:15px">
                        ${weapon.icon}
                    </div>

                    <h3>
                        ${weapon.name}
                    </h3>

                    <p>
                        LEVEL ${weapon.level}
                    </p>

                    <p>
                        قدرت:
                        ${weapon.damage}
                    </p>

                    <p>
                        سرعت تیر:
                        ${weapon.fireRate}
                    </p>

                    <button

/* =====================================================
   GAME ENGINE
===================================================== */

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


let gameRunning=false;

let gameWidth=0;
let gameHeight=0;

let player={
    x:0,
    y:0,
    width:85,
    height:120,
    hp:100
};

let bullets=[];
let zombies=[];
let explosions=[];

let gameKills=0;
let gameCoins=0;

let leftPressed=false;
let rightPressed=false;
let shooting=false;

let lastGameTime=0;
let spawnTimer=0;


/* =====================================================
   RESIZE
===================================================== */

function resizeGame(){

    gameWidth =
        window.innerWidth;

    gameHeight =
        window.innerHeight;

    canvas.width =
        gameWidth *
        devicePixelRatio;

    canvas.height =
        gameHeight *
        devicePixelRatio;

    canvas.style.width =
        gameWidth+"px";

    canvas.style.height =
        gameHeight+"px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

    player.x =
        gameWidth/2;

    player.y =
        gameHeight-160;

}

window.addEventListener(
    "resize",
    resizeGame
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    gameScreen.style.display =
        "block";

    gameRunning=true;

    gameKills=0;

    gameCoins=0;

    bullets=[];

    zombies=[];

    explosions=[];

    player.hp=100;

    resizeGame();

    lastGameTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   EXIT
===================================================== */

function exitGame(){

    gameRunning=false;

    gameScreen.style.display =
        "none";

}


/* =====================================================
   CONTROLS
===================================================== */

function holdButton(
    element,
    down,
    up
){

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    element.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            up();
        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

}


holdButton(
    document.getElementById(
        "leftBtn"
    ),
    ()=>leftPressed=true,
    ()=>leftPressed=false
);


holdButton(
    document.getElementById(
        "rightBtn"
    ),
    ()=>rightPressed=true,
    ()=>rightPressed=false
);


holdButton(
    document.getElementById(
        "fireBtn"
    ),
    ()=>shooting=true,
    ()=>shooting=false
);


document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="ArrowLeft")
            leftPressed=true;

        if(e.key==="ArrowRight")
            rightPressed=true;

        if(e.key===" ")
            shooting=true;

    }
);


document.addEventListener(
    "keyup",
    e=>{

        if(e.key==="ArrowLeft")
            leftPressed=false;

        if(e.key==="ArrowRight")
            rightPressed=false;

        if(e.key===" ")
            shooting=false;

    }
);


/* =====================================================
   SPAWN ZOMBIE
===================================================== */

function spawnZombie(){

    zombies.push({

        x:
            60+
            Math.random()*
            (gameWidth-120),

        y:-100,

        width:55,

        height:80,

        hp:100,

        speed:
            1.4+
            Math.random()*1.3

    });

}


/* =====================================================
   SHOOT
===================================================== */

let shootDelay=0;

function shoot(){

    if(shootDelay>0)
        return;

    bullets.push({

        x:player.x,

        y:player.y-70,

        speed:13,

        damage:35

    });

    shootDelay=8;

}


/* =====================================================
   UPDATE GAME
===================================================== */

function updateGame(dt){

    if(leftPressed){

        player.x-=7*dt;

    }

    if(rightPressed){

        player.x+=7*dt;

    }


    player.x =
        Math.max(
            50,
            Math.min(
                gameWidth-50,
                player.x
            )
        );


    if(shooting)
        shoot();


    shootDelay -= dt;


    spawnTimer -= dt;


    if(spawnTimer<=0){

        spawnZombie();

        spawnTimer =
            30+
            Math.random()*35;

    }


    bullets.forEach(
        bullet=>{
            bullet.y -=
                bullet.speed*dt;
        }
    );


    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];

        if(bullet.y<-50){

            bullets.splice(i,1);

            continue;

        }


        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const zombie =
                zombies[j];


            if(
                Math.abs(
                    bullet.x-
                    zombie.x
                )<35 &&

                Math.abs(
                    bullet.y-
                    zombie.y
                )<50
            ){

                zombie.hp -=
                    bullet.damage;

                bullets.splice(
                    i,
                    1
                );

                if(
                    zombie.hp<=0
                ){

                    gameKills++;

                    gameCoins+=25;

                    explosions.push({

                        x:zombie.x,

                        y:zombie.y,

                        life:30

                    });

                    zombies.splice(
                        j,
                        1
                    );

                }

                break;

            }

        }

    }


    zombies.forEach(
        zombie=>{

            zombie.y +=
                zombie.speed*dt;

            if(
                Math.abs(
                    zombie.x-
                    player.x
                )<55 &&

                Math.abs(
                    zombie.y-
                    player.y
                )<80
            ){

                player.hp -=
                    0.5*dt;

            }

        }
    );


    for(
        let i=explosions.length-1;
        i>=0;
        i--
    ){

        explosions[i].life -=
            dt;

        if(
            explosions[i].life<=0
        ){

            explosions.splice(
                i,
                1
            );

        }

    }


    if(player.hp<=0){

        player.hp=100;

        alert(
            "ماشین نابود شد!"
        );

        exitGame();

    }


    document.getElementById(
        "gameHP"
    ).textContent =
        Math.ceil(
            player.hp
        );

    document.getElementById(
        "gameKills"
    ).textContent =
        gameKills;

    document.getElementById(
        "gameCoins"
    ).textContent =
        gameCoins;

}


/* =====================================================
   DRAW ROAD
===================================================== */

function drawRoad(){

    const g =
        ctx.createLinearGradient(
            0,
            0,
            0,
            gameHeight
        );

    g.addColorStop(
        0,
        "#161b1d"
    );

    g.addColorStop(
        1,
        "#07090a"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        gameWidth,
        gameHeight
    );


    /* buildings */

    for(
        let i=0;
        i<14;
        i++
    ){

        const width=70+
            (i%4)*25;

        const height=100+
            (i%5)*35;

        const x=
            i*110-
            50;

        ctx.fillStyle =
            i%2
                ? "#101416"
                : "#171b1d";

        ctx.fillRect(
            x,
            250-height,
            width,
            height
        );

    }


    /* road */

    const roadWidth =
        Math.min(
            gameWidth*.68,
            700
        );

    const roadX =
        (gameWidth-roadWidth)/2;


    ctx.fillStyle =
        "#24282a";

    ctx.fillRect(
        roadX,
        0,
        roadWidth,
        gameHeight
    );


    /* road edges */

    ctx.fillStyle =
        "#111516";

    ctx.fillRect(
        roadX,
        0,
        12,
        gameHeight
    );

    ctx.fillRect(
        roadX+
        roadWidth-12,
        0,
        12,
        gameHeight
    );


    /* center line */

    ctx.strokeStyle =
        "#dedbd2";

    ctx.lineWidth=5;

    ctx.setLineDash([
        40,
        40
    ]);

    ctx.beginPath();

    ctx.moveTo(
        gameWidth/2,
        0
    );

    ctx.lineTo(
        gameWidth/2,
        gameHeight
    );

    ctx.stroke();

    ctx.setLineDash([]);

}


/* =====================================================
   DRAW CAR
===================================================== */

function drawCar(){

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    /* shadow */

    ctx.fillStyle="#0009";

    ctx.beginPath();

    ctx.ellipse(
        0,
        55,
        62,
        18,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    const g =
        ctx.createLinearGradient(
            -45,
            -70,
            45,
            70
        );

    g.addColorStop(
        0,
        "#727477"
    );

    g.addColorStop(
        .35,
        "#202427"
    );

    g.addColorStop(
        .65,
        "#090b0c"
    );

    g.addColorStop(
        1,
        "#4b4e50"
    );


    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.roundRect(
        -45,
        -70,
        90,
        140,
        18
    );

    ctx.fill();


    ctx.strokeStyle =
        "#9b8550";

    ctx.lineWidth=3;

    ctx.stroke();


    /* window */

    ctx.fillStyle =
        "#657e8c";

    ctx.beginPath();

    ctx.roundRect(
        -29,
        -45,
        58,
        38,
        9
    );

    ctx.fill();


    ctx.strokeStyle =
        "#242a2c";

    ctx.stroke();


    /* windshield reflection */

    ctx.fillStyle =
        "#dcecf244";

    ctx.fillRect(
        -22,
        -39,
        6,
        27
    );


    /* headlights */

    ctx.fillStyle =
        "#fff3b0";

    ctx.shadowBlur=20;

    ctx.shadowColor =
        "#fff1a0";

    ctx.fillRect(
        -31,
        -61,
        18,
        8
    );

    ctx.fillRect(
        13,
        -61,
        18,
        8
    );

    ctx.shadowBlur=0;


    /* weapon mount */

    ctx.fillStyle =
        "#181a1b";

    ctx.fillRect(
        -8,
        -92,
        16,
        35
    );

    ctx.fillRect(
        -4,
        -115,
        8,
        35
    );


    /* machine gun */

    ctx.fillStyle =
        "#090a0a";

    ctx.fillRect(
        -4,
        -123,
        8,
        35
    );


    /* wheels */

    ctx.fillStyle =
        "#050505";

    ctx.fillRect(
        -51,
        -25,
        10,
        40
    );

    ctx.fillRect(
        41,
        -25,
        10,
        40
    );


    /* red tail */

    ctx.fillStyle =
        "#d71919";

    ctx.fillRect(
        -27,
        57,
        17,
        6
    );

    ctx.fillRect(
        10,
        57,
        17,
        6
    );


    ctx.restore();

}


/* =====================================================
   DRAW ZOMBIE
===================================================== */

function drawZombie(zombie){

    ctx.save();

    ctx.translate(
        zombie.x,
        zombie.y
    );


    /* shadow */

    ctx.fillStyle="#0009";

    ctx.beginPath();

    ctx.ellipse(
        0,
        42,
        32,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle =
        "#59684b";

    ctx.beginPath();

    ctx.roundRect(
        -22,
        -5,
        44,
        50,
        12
    );

    ctx.fill();


    /* head */

    ctx.fillStyle =
        "#72855b";

    ctx.beginPath();

    ctx.arc(
        0,
        -25,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* arms */

    ctx.strokeStyle =
        "#4d5d43";

    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.moveTo(
        -16,
        4
    );

    ctx.lineTo(
        -39,
        35
    );

    ctx.moveTo(
        16,
        4
    );

    ctx.lineTo(
        39,
        30
    );

    ctx.stroke();


    /* eyes */

    ctx.fillStyle =
        "#e0eea5";

    ctx.beginPath();

    ctx.arc(
        -8,
        -29,
        5,
        0,
        Math.PI*2
    );

    ctx.arc(
        8,
        -29,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* mouth */

    ctx.fillStyle =
        "#111";

    ctx.fillRect(
        -10,
        -15,
        20,
        6
    );


    /* health */

    ctx.fillStyle =
        "#151515";

    ctx.fillRect(
        -25,
        -58,
        50,
        6
    );

    ctx.fillStyle =
        "#e11";

    ctx.fillRect(
        -25,
        -58,
        50*
        Math.max(
            0,
            zombie.hp/100
        ),
        6
    );


    ctx.restore();

}


/* =====================================================
   DRAW BULLETS
===================================================== */

function drawBullets(){

    bullets.forEach(
        bullet=>{

            ctx.save();

            ctx.shadowBlur=20;

            ctx.shadowColor =
                "#ff9b2e";

            ctx.fillStyle =
                "#ffe09a";

            ctx.fillRect(
                bullet.x-3,
                bullet.y-14,
                6,
                18
            );

            ctx.restore();

        }
    );

}


/* =====================================================
   EXPLOSIONS
===================================================== */

function drawExplosions(){

    explosions.forEach(
        e=>{

            const radius =
                45-
                e.life;

            const gradient =
                ctx.createRadialGradient(
                    e.x,
                    e.y,
                    0,
                    e.x,
                    e.y,
                    radius
                );

            gradient.addColorStop(
                0,
                "#fff"
            );

            gradient.addColorStop(
                .25,
                "#ffdf43"
            );

            gradient.addColorStop(
                .6,
                "#ff641e"
            );

            gradient.addColorStop(
                1,
                "transparent"
            );

            ctx.fillStyle=gradient;

            ctx.beginPath();

            ctx.arc(
                e.x,
                e.y,
                radius,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =====================================================
   DRAW GAME
===================================================== */

function drawGame(){

    drawRoad();

    zombies.forEach(
        drawZombie
    );

    drawBullets();

    drawExplosions();

    drawCar();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    if(!gameRunning)
        return;


    const dt =
        Math.min(
            (time-lastGameTime)/16.67,
            2
        );

    lastGameTime=time;


    updateGame(dt);

    drawGame();


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   START
===================================================== */

updateCoins();

</script>
