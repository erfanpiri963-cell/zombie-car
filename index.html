<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Car</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07090b;font-family:Arial,sans-serif;touch-action:none}
.hidden{display:none!important}

#menuScreen{
 position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 color:#fff;background:radial-gradient(circle at 50% 30%,#555d62,#20262b 40%,#080a0c)
}
.logo{font-size:clamp(34px,10vw,58px);font-weight:900;text-align:center;text-shadow:0 4px #000,0 10px 30px #000;margin-bottom:10px}
.subtitle{color:#c8ced2;margin-bottom:30px}

#startBtn,#restartBtn{
 border:0;border-radius:17px;padding:17px 42px;color:#fff;font-size:20px;font-weight:bold;
 background:linear-gradient(#f45145,#b71c1c);box-shadow:0 8px 25px #0009
}
#startBtn:active,#restartBtn:active{transform:scale(.94)}

#gameScreen{position:fixed;inset:0;overflow:hidden;background:#111}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{
 position:absolute;top:13px;left:10px;right:10px;z-index:20;
 display:flex;justify-content:space-between;pointer-events:none
}
.hudBox{
 min-width:75px;padding:8px 10px;border-radius:13px;color:white;font-weight:bold;
 font-size:15px;text-align:center;background:#050505b8;border:1px solid #ffffff20;
 backdrop-filter:blur(7px);box-shadow:0 5px 18px #0008
}
#stageBox{
 position:absolute;top:65px;left:50%;transform:translateX(-50%);z-index:21;
 color:#fff;background:#0009;padding:7px 18px;border-radius:20px;font-weight:bold;
 border:1px solid #ffffff25
}

#controls{
 position:absolute;left:0;right:0;bottom:22px;z-index:30;
 display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 20px;
 direction:ltr;align-items:center
}
.controlBtn{
 width:78px;height:78px;border-radius:50%;border:2px solid #ffffff25;color:#fff;
 background:#00000070;font-size:30px;font-weight:bold;box-shadow:0 6px 20px #0008;
 backdrop-filter:blur(7px);touch-action:none
}
#leftBtn{justify-self:start}
#rightBtn{justify-self:end}
#fireBtn{
 justify-self:center;width:90px;height:90px;border-radius:50%;border:2px solid #ffffff30;
 color:white;font-size:35px;background:linear-gradient(#ff7043,#c62828);

}
.controlBtn:active,#fireBtn:active{transform:scale(.9)}

 position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;

}

#gameOver p{color:#ddd;margin-bottom:10px}

 0%{opacity:0;transform:scale(.5)}
 20%{opacity:1;transform:scale(1.15)}
 70%{opacity:1;transform:scale(1)}

}

<body>

<div id="menuScreen">
 <div class="logo">🚗 ZOMBIE CAR 🧟</div>
 <div class="subtitle">جاده پر از زامبی شده...</div>
 <button id="startBtn">▶ شروع بازی</button>
</div>

<div id="gameScreen" class="hidden">

 <canvas id="game"></canvas>

 <div id="hud">
  <div class="hudBox">❤️ <span id="hp">100</span></div>
  <div class="hudBox">🪙 <span id="coins">0</span></div>
  <div class="hudBox">☠️ <span id="kills">0</span></div>
 </div>

 <div id="stageBox">🎯 مرحله <span id="stage">1</span></div>
 <div id="stageMessage"></div>

 <div id="controls">
  <button id="leftBtn" class="controlBtn">◀</button>
  <button id="fireBtn">🔫</button>
  <button id="rightBtn" class="controlBtn">▶</button>
 </div>

 <div id="gameOver" class="hidden">
  <h1>💀 باختی!</h1>
  <p>مرحله: <b id="finalStage">1</b></p>
  <p>زامبی‌های کشته‌شده: <b id="finalKills">0</b></p>
  <button id="restartBtn">🔄 دوباره بازی کن</button>
 </div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const menu=document.getElementById("menuScreen");
const game=document.getElementById("gameScreen");

let W=0,H=0,carX=0;

let hp=100;
let coins=0;
let kills=0;
let stage=1;
let stageKills=0;

let bullets=[];
let zombies=[];
let particles=[];

let leftDown=false;
let rightDown=false;
let fireDown=false;

let running=false;
let last=0;
let fireTimer=0;
let spawnTimer=0;
let roadOffset=0;
let stageChanging=false;

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W;
 canvas.height=H;
 if(!carX)carX=W/2;
}
addEventListener("resize",resize);

function updateHUD(){
 document.getElementById("hp").textContent=Math.max(0,Math.round(hp));
 document.getElementById("coins").textContent=coins;
 document.getElementById("kills").textContent=kills;
 document.getElementById("stage").textContent=stage;
}

function requiredKills(){
 return 8+(stage-1)*7;
}

function showStageMessage(text){
 const box=document.getElementById("stageMessage");
 box.innerHTML='<div class="stageText">'+text+'</div>';
 setTimeout(()=>box.innerHTML="",1400);
}

function nextStage(){

 if(stageChanging)return;

 stageChanging=true;

 stage++;
 stageKills=0;

 zombies.length=0;
 bullets.length=0;

 updateHUD();

 showStageMessage("🎯 مرحله "+stage);

 spawnTimer=50;

 setTimeout(()=>{
  stageChanging=false;
 },1200);
}

document.getElementById("startBtn").onclick=()=>{

 menu.classList.add("hidden");
 game.classList.remove("hidden");
 document.getElementById("gameOver").classList.add("hidden");

 resize();

 carX=W/2;

 hp=100;
 coins=0;
 kills=0;
 stage=1;
 stageKills=0;

 bullets=[];
 zombies=[];
 particles=[];

 fireTimer=0;
 spawnTimer=15;
 roadOffset=0;
 stageChanging=false;

 updateHUD();
 showStageMessage("🎯 مرحله ۱");

 running=true;
 last=performance.now();

 requestAnimationFrame(loop);
};

document.getElementById("restartBtn").onclick=()=>{
 document.getElementById("startBtn").click();
};

function hold(btn,on,off){

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  on();
 });

 btn.addEventListener("pointerup",e=>{
  e.preventDefault();
  off();
 });

 btn.addEventListener("pointercancel",off);
 btn.addEventListener("pointerleave",off);
}

hold(document.getElementById("leftBtn"),()=>leftDown=true,()=>leftDown=false);
hold(document.getElementById("rightBtn"),()=>rightDown=true,()=>rightDown=false);
hold(document.getElementById("fireBtn"),()=>fireDown=true,()=>fireDown=false);

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")leftDown=true;
 if(e.key==="ArrowRight")rightDown=true;
 if(e.code==="Space")fireDown=true;
});

addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")leftDown=false;
 if(e.key==="ArrowRight")rightDown=false;
 if(e.code==="Space")fireDown=false;
});


/* ROAD */

function drawRoad(){

 ctx.fillStyle="#0d1510";
 ctx.fillRect(0,0,W,H);

 const rw=Math.min(W*.88,520);
 const rx=(W-rw)/2;

 ctx.fillStyle="#152218";
 ctx.fillRect(0,0,rx,H);
 ctx.fillRect(rx+rw,0,rx,H);

 ctx.fillStyle="#30363a";
 ctx.fillRect(rx,0,rw,H);

 ctx.fillStyle="#3b4145";

 for(let y=-80;y<H;y+=100){
  ctx.fillRect(rx+15,y+(roadOffset%100),rw-30,2);
 }

 ctx.fillStyle="#d2d2d2";
 ctx.fillRect(rx,0,5,H);
 ctx.fillRect(rx+rw-5,0,5,H);

 ctx.strokeStyle="#eee";
 ctx.lineWidth=5;
 ctx.setLineDash([42,34]);
 ctx.lineDashOffset=roadOffset;

 ctx.beginPath();
 ctx.moveTo(W/2,0);
 ctx.lineTo(W/2,H);
 ctx.stroke();

 ctx.setLineDash([]);

 roadOffset+=4+(stage*.35);
 if(roadOffset>76)roadOffset=0;
}


/* CAR */

function drawCar(){

 const y=H-145;

 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(carX,y+52,43,12,0,0,Math.PI*2);
 ctx.fill();

 const grad=ctx.createLinearGradient(carX-30,y,carX+30,y);
 grad.addColorStop(0,"#9d1010");
 grad.addColorStop(.45,"#ef3d32");
 grad.addColorStop(1,"#8d0c0c");

 ctx.fillStyle=grad;

 ctx.beginPath();
 ctx.roundRect(carX-31,y-56,62,111,13);
 ctx.fill();

 ctx.fillStyle="#8d1111";
 ctx.beginPath();
 ctx.roundRect(carX-24,y-42,48,50,10);
 ctx.fill();

 const glass=ctx.createLinearGradient(0,y-40,0,y+8);
 glass.addColorStop(0,"#b3ecff");
 glass.addColorStop(1,"#1976a8");

 ctx.fillStyle=glass;
 ctx.beginPath();
 ctx.roundRect(carX-19,y-35,38,29,6);
 ctx.fill();

 ctx.fillStyle="#ffcc80";
 ctx.fillRect(carX-2,y-1,4,30);

 ctx.fillStyle="#444";
 ctx.fillRect(carX-25,y+40,50,7);

 ctx.fillStyle="#080808";

 ctx.fillRect(carX-39,y-33,11,31);
 ctx.fillRect(carX+28,y-33,11,31);
 ctx.fillRect(carX-39,y+18,11,31);
 ctx.fillRect(carX+28,y+18,11,31);
}


/* تعیین نوع زامبی */

function randomZombieType(){

 const r=Math.random();

 if(stage===1){
  return "normal";
 }

 if(stage===2){
  return r<.65 ? "normal" : "fast";
 }

 if(stage===3){
  if(r<.45)return "normal";
  if(r<.75)return "fast";
  return "strong";
 }

 if(r<.30)return "normal";
 if(r<.62)return "fast";
 return "strong";
}


/* SPAWN */

function spawnZombie(){

 if(stageChanging)return;

 const rw=Math.min(W*.88,520);
 const rx=(W-rw)/2;

 const type=randomZombieType();

 let z;

 if(type==="normal"){

  z={
   type:"normal",
   x:rx+35+Math.random()*(rw-70),
   y:-65,
   speed:1.5+Math.random()*1.2+stage*.2,
   w:42,
   h:60,
   hp:1,
   maxHp:1,
   reward:5
  };

 }

 else if(type==="fast"){

  z={
   type:"fast",
   x:rx+35+Math.random()*(rw-70),
   y:-65,
   speed:3.0+Math.random()*1.4+stage*.25,
   w:34,
   h:52,
   hp:1,
   maxHp:1,
   reward:8
  };

 }

 else{

  z={
   type:"strong",
   x:rx+35+Math.random()*(rw-70),
   y:-65,
   speed:.85+Math.random()*.55+stage*.12,
   w:52,
   h:70,
   hp:3,
   maxHp:3,
   reward:15
  };

 }

 zombies.push(z);
}


/* ZOMBIE DRAW */

function drawZombie(z){

 ctx.save();
 ctx.translate(z.x,z.y);

 if(z.type==="normal"){

  ctx.fillStyle="#0006";
  ctx.beginPath();
  ctx.ellipse(0,31,23,7,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#283c29";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-9,25);
  ctx.lineTo(-13,42);
  ctx.moveTo(9,25);
  ctx.lineTo(13,42);
  ctx.stroke();

  ctx.fillStyle="#4f914c";
  ctx.beginPath();
  ctx.roundRect(-19,-4,38,38,8);
  ctx.fill();

  ctx.strokeStyle="#69a94d";
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(-17,0);
  ctx.lineTo(-31,15);
  ctx.moveTo(17,0);
  ctx.lineTo(31,15);
  ctx.stroke();

  ctx.fillStyle="#69a94d";
  ctx.beginPath();
  ctx.arc(0,-23,19,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#160d0d";
  ctx.fillRect(-9,-27,5,6);
  ctx.fillRect(4,-27,5,6);

  ctx.fillStyle="#eee";
  ctx.fillRect(-9,-13,18,5);

 }

 else if(z.type==="fast"){

  ctx.fillStyle="#0006";
  ctx.beginPath();
  ctx.ellipse(0,28,19,6,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#7b1fa2";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-8,18);
  ctx.lineTo(-17,40);
  ctx.moveTo(8,18);
  ctx.lineTo(17,40);
  ctx.stroke();

  ctx.fillStyle="#9c27b0";
  ctx.beginPath();
  ctx.roundRect(-15,-7,30,32,8);
  ctx.fill();

  ctx.strokeStyle="#ce93d8";
  ctx.lineWidth=6;

  ctx.beginPath();
  ctx.moveTo(-13,-1);
  ctx.lineTo(-29,10);
  ctx.moveTo(13,-1);
  ctx.lineTo(29,10);
  ctx.stroke();

  ctx.fillStyle="#ba68c8";
  ctx.beginPath();
  ctx.arc(0,-22,16,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffeb3b";
  ctx.fillRect(-8,-25,5,5);
  ctx.fillRect(3,-25,5,5);

  ctx.fillStyle="#111";
  ctx.fillRect(-7,-12,14,4);

 }

 else{

  ctx.fillStyle="#0007";
  ctx.beginPath();
  ctx.ellipse(0,38,30,9,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#4e342e";
  ctx.lineWidth=13;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-12,30);
  ctx.lineTo(-18,50);
  ctx.moveTo(12,30);
  ctx.lineTo(18,50);
  ctx.stroke();

  ctx.fillStyle="#6d4c41";
  ctx.beginPath();
  ctx.roundRect(-24,-2,48,43,10);
  ctx.fill();

  ctx.strokeStyle="#8d6e63";
  ctx.lineWidth=11;

  ctx.beginPath();
  ctx.moveTo(-21,2);
  ctx.lineTo(-40,22);
  ctx.moveTo(21,2);
  ctx.lineTo(40,22);
  ctx.stroke();

  ctx.fillStyle="#795548";
  ctx.beginPath();
  ctx.arc(0,-25,24,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ff1744";
  ctx.fillRect(-11,-30,6,7);
  ctx.fillRect(5,-30,6,7);

  ctx.fillStyle="#111";
  ctx.fillRect(-12,-14,24,7);

  /* نوار جان */

  ctx.fillStyle="#222";
  ctx.fillRect(-24,-55,48,5);

  ctx.fillStyle="#ef5350";
  ctx.fillRect(-24,-55,48*(z.hp/z.maxHp),5);
 }

 ctx.restore();
}


/* SHOOT */

function shoot(){

 bullets.push({
  x:carX,
  y:H-205,
  speed:14,
  damage:1
 });
}


/* BULLETS */

function updateBullets(dt){

 bullets.forEach(b=>{
  b.y-=b.speed*dt;
 });

 bullets=bullets.filter(b=>b.y>-30);
}

function drawBullets(){

 bullets.forEach(b=>{

  ctx.shadowBlur=15;
  ctx.shadowColor="#ffcf33";

  ctx.fillStyle="#ffd740";

  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
 });
}


/* PARTICLES */

function burst(x,y){

 for(let i=0;i<18;i++){

  particles.push({
   x:x,
   y:y,
   vx:(Math.random()-.5)*7,
   vy:(Math.random()-.5)*7,
   life:25+Math.random()*15
  });
 }
}

function updateParticles(dt){

 particles.forEach(p=>{
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
 });

 particles=particles.filter(p=>p.life>0);
}

function drawParticles(){

 particles.forEach(p=>{

  ctx.globalAlpha=Math.max(0,p.life/30);
  ctx.fillStyle="#ff7043";
  ctx.fillRect(p.x,p.y,5,5);

 });

 ctx.globalAlpha=1;
}


/* COLLISION */

function hit(a,b){

 return Math.abs(a.x-b.x)<
 (a.w+b.w)/2 &&
 Math.abs(a.y-b.y)<
 (a.h+b.h)/2;
}


/* GAME OVER */

function gameOver(){

 running=false;

 document.getElementById("finalKills").textContent=kills;
 document.getElementById("finalStage").textContent=stage;

 document.getElementById("gameOver").classList.remove("hidden");
}


/* LOOP */

function loop(t){

 if(!running)return;

 const dt=Math.min((t-last)/16.67,2);
 last=t;

 if(leftDown)carX-=7*dt;
 if(rightDown)carX+=7*dt;

 const rw=Math.min(W*.88,520);
 const rx=(W-rw)/2;

 carX=Math.max(
  rx+45,
  Math.min(rx+rw-45,carX)
 );

 fireTimer-=dt;

 if(fireDown && fireTimer<=0){
  shoot();
  fireTimer=9;
 }

 spawnTimer-=dt;

 if(spawnTimer<=0 && !stageChanging){

  spawnZombie();

  spawnTimer=Math.max(
   15,
   48-stage*5-kills*.12
  );
 }

 zombies.forEach(z=>{
  z.y+=z.speed*dt;
 });

 updateBullets(dt);
 updateParticles(dt);

 let shouldChangeStage=false;

 for(let i=zombies.length-1;i>=0;i--){

  const z=zombies[i];
  let dead=false;

  /* گلوله */

  for(let j=bullets.length-1;j>=0;j--){

   const b=bullets[j];

   if(
    Math.abs(b.x-z.x)<
    (z.type==="strong"?38:30)
    &&
    Math.abs(b.y-z.y)<
    (z.type==="strong"?50:38)
   ){

    bullets.splice(j,1);

    z.hp--;

    burst(z.x,z.y);

    if(z.hp<=0){

     zombies.splice(i,1);

     kills++;
     stageKills++;
     coins+=z.reward;

     updateHUD();

     if(
      stageKills>=requiredKills()
      &&
      stage<4
      &&
      !stageChanging
     ){
      shouldChangeStage=true;
     }

     dead=true;
    }

    break;
   }
  }

  if(dead)continue;

  /* برخورد ماشین */

  if(
   hit(
    {
     x:carX,
     y:H-145,
     w:55,
     h:95
    },
    z
   )
  ){

   zombies.splice(i,1);

   if(z.type==="strong")
    hp-=30;
   else if(z.type==="fast")
    hp-=15;
   else
    hp-=20;

   burst(z.x,z.y);

   updateHUD();

   if(hp<=0){

    hp=0;
    updateHUD();
    gameOver();
    return;
   }

   continue;
  }

  if(z.y>H+100){
   zombies.splice(i,1);
  }
 }

 /*
  انتقال مرحله فقط بعد از پایان کامل
  حلقه برخورد انجام می‌شود.
 */

 if(
  shouldChangeStage &&
  !stageChanging &&
  running
 ){
  nextStage();
 }

 drawRoad();
 zombies.forEach(drawZombie);
 drawCar();
 drawBullets();
 drawParticles();

 requestAnimationFrame(loop);
}

resize();

</script>

</body>
</html>
