<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <meta name="theme-color" content="#090b0d">

  <title>Zombie Car</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================
     MAIN MENU
========================= -->

<section id="menuScreen" class="screen">

  <div class="menu-content">

    <div class="logo">
      <div class="logo-small">ZOMBIE</div>
      <div class="logo-big">CAR</div>
    </div>

    <div class="hero-car">
      🚗
    </div>

    <div class="coins-display">
      <span>🪙</span>
      <span id="menuCoins">0</span>
    </div>

    <button id="startBtn" class="main-btn start-btn">
      ▶ شروع بازی
    </button>

    <button id="garageBtn" class="main-btn">
      🔧 گاراژ
    </button>

    <div class="version">
      ZOMBIE CAR • v1.0
    </div>

  </div>

</section>


<!-- =========================
     GARAGE
========================= -->

<section id="garageScreen" class="screen hidden">

  <div class="garage-content">

    <button id="backBtn" class="back-btn">
      ← بازگشت
    </button>

    <h1>🔧 گاراژ</h1>

    <div class="garage-coins">
      🪙 <span id="garageCoins">0</span>
    </div>

    <div class="garage-car">
      🚗
    </div>

    <div class="upgrade-card">

      <div>
        <strong>⚡ سرعت ماشین</strong>
        <small id="speedLevel">سطح 1</small>
      </div>

      <button id="speedUpgrade">
        🪙 50
      </button>

    </div>


    <div class="upgrade-card">

      <div>
        <strong>❤️ زره ماشین</strong>
        <small id="armorLevel">سطح 1</small>
      </div>

      <button id="armorUpgrade">
        🪙 50
      </button>

    </div>


    <div class="upgrade-card">

      <div>
        <strong>🔫 قدرت سلاح</strong>
        <small id="weaponLevel">سطح 1</small>
      </div>

      <button id="weaponUpgrade">
        🪙 50
      </button>

    </div>

  </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen" class="hidden">

  <canvas id="game"></canvas>


  <!-- HUD -->

  <div id="hud">

    <div class="hud-item health">

      <div class="hud-icon">❤️</div>

      <div class="hud-info">

        <div class="hud-title">
          جان
        </div>

        <div class="health-bar">
          <div id="hpFill"></div>
        </div>

        <span id="hp">100</span>

      </div>

    </div>


    <div class="hud-item">
      <span class="hud-icon">🪙</span>
      <span id="coins">0</span>
    </div>


    <div class="hud-item">
      <span class="hud-icon">☠️</span>
      <span id="kills">0</span>
    </div>

  </div>


  <!-- Score -->

  <div id="score">
    امتیاز: <b id="scoreValue">0</b>
  </div>


  <!-- Controls -->

  <div id="controls">

    <button id="left" class="control">
      ◀
    </button>

    <button id="fire" class="control fire">
      🔫
    </button>

    <button id="right" class="control">
      ▶
    </button>

  </div>


  <!-- Pause -->

  <button id="pauseBtn">
    ❚❚
  </button>


  <!-- GAME OVER -->

  <div id="gameover" class="hidden">

    <div class="gameover-box">

      <div class="dead-icon">
        💀
      </div>

      <h1>GAME OVER</h1>

      <p>
        زامبی‌های کشته شده:
        <strong id="finalKills">0</strong>
      </p>

      <p>
        امتیاز:
        <strong id="finalScore">0</strong>
      </p>

      <button id="restart">
        🔄 دوباره بازی کن
      </button>

      <button id="menuBtn">
        🏠 منوی اصلی
      </button>

    </div>

  </div>

</section>


<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="game.js"></script>

</body>
</html>
