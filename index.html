<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Road: Nitro</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080a0b;
    font-family:Tahoma,Arial,sans-serif;
    color:white;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:linear-gradient(
        #26343b 0%,
        #718078 45%,
        #25292a 46%,
        #090a0b 100%
    );
}

/* آسمان */
.sky{
    position:absolute;
    inset:0;
    background:linear-gradient(
        #17232999,
        #858d8744 45%,
        transparent 65%
    );
}

/* کنار جاده */
.edge{
    position:absolute;
    top:0;
    bottom:0;
    width:18%;
    background:linear-gradient(
        #394244,
        #202525 55%,
        #111
    );
}

.edge.l{left:0}
.edge.r{right:0}

/* جاده */
.road{
    position:absolute;
    left:18%;
    right:18%;
    top:0;
    bottom:0;
    background:#303436;
    border-left:7px solid #161819;
    border-right:7px solid #161819;
}

/* خط وسط جاده */
.road:before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:8px;
    transform:translateX(-50%);
    background:repeating-linear-gradient(
        to bottom,
        #ddd 0 45px,
        transparent 45px 90px
    );
    opacity:.7;
}

/* درخت‌ها */
.tree{
    position:absolute;
    bottom:42%;
    font-size:70px;
    filter:drop-shadow(0 12px 8px #0009);
}

.t1{left:5%}
.t2{right:5%}
.t3{
    left:12%;
    bottom:54%;
    font-size:48px;
}
.t4{
    right:12%;
    bottom:52%;
    font-size:52px;
}

/* ماشین */
#car{
    position:absolute;
    width:112px;
    height:185px;
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    z-index:10;
}

.body{
    position:absolute;
    left:12px;
    right:12px;
    top:8px;
    bottom:8px;

    border-radius:30px 30px 20px 20px;

    background:linear-gradient(
        90deg,
        #111,
        #687075 25%,
        #24292c 50%,
        #687075 75%,
        #111
    );

    border:3px solid #a88a43;

    box-shadow:
        0 18px 25px #000b;
}

.window{
    position:absolute;
    left:25px;
    right:25px;
    top:32px;
    height:48px;

    border-radius:15px;

    background:linear-gradient(
        135deg,
        #78909c,
        #1b252b
    );

    border:2px solid #aeb8bd;
}

.light{
    position:absolute;
    top:17px;
    width:20px;
    height:9px;

    background:#fff2a0;
    box-shadow:0 0 18px #fff2a0;
}

.light.l{left:20px}
.light.r{right:20px}

.wheel{
    position:absolute;
    width:13px;
    height:48px;
    top:70px;

    background:#080808;
    border-radius:9px;
}

.wheel.l{left:0}
.wheel.r{right:0}

/* زامبی */
#zombies{
    position:absolute;
    inset:0;
    z-index:12;
    pointer-events:none;
}

.z{
    position:absolute;
    width:58px;
    height:80px;

    font-size:54px;

    filter:drop-shadow(
        0 8px 5px #0009
    );
}

/* HUD */
#hud{
    position:absolute;
    z-index:30;

    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    gap:8px;

    pointer-events:none;
}

.box{
    display:inline-block;

    background:#050708dd;
    border:1px solid #777;

    padding:7px 10px;
    margin:2px;

    font-weight:900;
    border-radius:4px;
}

/*
=================================================
مهم:
direction:ltr باعث می‌شود ترتیب واقعی دکمه‌ها
از چپ به راست باشد:

◀    🔥    ▶
=================================================
*/

#controls{
    position:absolute;

    z-index:40;

    left:0;
    right:0;
    bottom:14px;

    display:flex;

    align-items:end;
    justify-content:space-between;

    padding:0 18px;

    direction:ltr;

    pointer-events:none;
}

.ctrl{
    pointer-events:auto;

    width:76px;
    height:68px;

    border-radius:50%;

    border:2px solid #777;

    background:
        radial-gradient(
            #34383b,
            #090a0b
        );

    color:white;

    font-size:30px;

    touch-action:none;
}

.fire{
    width:92px;
    height:92px;

    background:
        radial-gradient(
            #ffbd43,
            #d82c1c 55%,
            #670000
        );

    border-color:#ffd36b;

    font-size:36px;
}

.nitro{
    width:78px;
    height:55px;

    border-radius:12px;

    background:
        linear-gradient(
            #22a9ff,
            #064a9c
        );

    border:2px solid #8ed7ff;

    color:white;

    font-size:16px;
    font-weight:900;

    touch-action:none;
}

/* صفحه شروع */
#start{
    position:absolute;
    z-index:80;

    inset:0;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle,
            #253238,
            #050607 70%
        );
}

.startbox{
    text-align:center;
}

.startbox h1{
    font-size:40px;

    text-shadow:
        0 5px 15px #000;
}

.startbox p{
    color:#ccc;
}

.start{
    width:240px;

    padding:18px;

    border:2px solid #ffc43b;

    background:
        linear-gradient(
            #e63c25,
            #790900
        );

    color:white;

    font-size:26px;

    font-weight:900;

    border-radius:6px;
}

/* صفحه پایان */
#result{
    position:absolute;

    z-index:150;

    inset:0;

    display:none;

    place-items:center;

    background:#000b;
}

.resultbox{
    background:#101315;

    border:1px solid #c59a28;

    padding:28px;

    text-align:center;

    width:min(420px,90vw);
}

/* موبایل */
@media(max-width:650px){

    .road{
        left:12%;
        right:12%;
    }

    .edge{
        width:12%;
    }

    .tree{
        font-size:50px;
    }

    .startbox h1{
        font-size:30px;
    }

}
</style>
</head>

<body>

<div id="game">

    <div class="sky"></div>

    <div class="edge l"></div>
    <div class="edge r"></div>

    <div class="road"></div>

    <div class="tree t1">🌲</div>
    <div class="tree t2">🌲</div>
    <div class="tree t3">🌲</div>
    <div class="tree t4">🌲</div>

    <div id="zombies"></div>

    <div id="car">

        <div class="body">

            <div class="window"></div>

            <i class="light l"></i>
            <i class="light r"></i>

            <i class="wheel l"></i>
            <i class="wheel r"></i>

        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div>

            <span class="box">
                ☠️
                <b id="kills">0</b>
            </span>

            <span class="box">
                ❤️
                <b id="hp">100</b>
            </span>

        </div>

        <div>

            <span class="box">
                📏
                <b id="distance">0.00</b>
                mi
            </span>

            <span class="box">
                ⚡
                <b id="nitroText">100</b>
            </span>

        </div>

    </div>


    <!-- کنترل‌ها -->

    <div id="controls">

        <!-- چپ -->
        <button
            class="ctrl"
            id="left">
            ◀
        </button>

        <!-- تیراندازی -->
        <button
            class="ctrl fire"
            id="fire">
            🔥
        </button>

        <!-- راست -->
        <button
            class="ctrl"
            id="right">
            ▶
        </button>

        <!-- نیترو -->
        <button
            class="nitro"
            id="nitro">
            NITRO
        </button>

    </div>


    <!-- شروع -->

    <div id="start">

        <div class="startbox">

            <h1>
                🧟 ZOMBIE ROAD
            </h1>

            <h2>
                NITRO
            </h2>

            <p>
                نسخه مستقل با الهام از سبک
                Zombie Highway 2
            </p>

            <button
                class="start"
                onclick="begin()">

                شروع بازی

            </button>

        </div>

    </div>


    <!-- پایان -->

    <div id="result">

        <div class="resultbox">

            <h1>
                🏁 پایان ران
            </h1>

            <p>
                کشتار:
                <b id="finalKills">0</b>
            </p>

            <p>
                مسافت:
                <b id="finalDistance">0</b>
                مایل
            </p>

            <button
                class="start"
                onclick="restart()">

                دوباره

            </button>

        </div>

    </div>

</div>


<script>

/* ==========================================
   متغیرهای بازی
========================================== */

let running = false;

let leftOn = false;
let rightOn = false;
let fireOn = false;
let nitroOn = false;

let last = 0;

let spawnTimer = 0;
let shotTimer = 0;

let x = innerWidth / 2;

let kills = 0;
let hp = 100;
let distance = 0;

let nitro = 100;

let damage = 25;
let armor = 1;

let zombies = [];
let bullets = [];


/* ==========================================
   عناصر
========================================== */

const car =
    document.getElementById("car");

const zombieContainer =
    document.getElementById("zombies");


/* ==========================================
   محدود کردن ماشین
========================================== */

function positionCar(){

    const minX =
        innerWidth * 0.13 + 60;

    const maxX =
        innerWidth * 0.87 - 60;

    x =
        Math.max(
            minX,
            Math.min(maxX,x)
        );

    car.style.left =
        x + "px";
}

window.addEventListener(
    "resize",
    positionCar
);


/* ==========================================
   کنترل لمسی
========================================== */

function holdButton(
    id,
    down,
    up
){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            button.setPointerCapture?.(
                event.pointerId
            );

            down();

        }
    );

    [
        "pointerup",
        "pointercancel",
        "lostpointercapture"
    ].forEach(type => {

        button.addEventListener(
            type,
            event => {

                event.preventDefault();

                up();

            }
        );

    });

}


/* ==========================================
   چپ
========================================== */

holdButton(
    "left",

    () => {
        leftOn = true;
    },

    () => {
        leftOn = false;
    }
);


/* ==========================================
   راست
========================================== */

holdButton(
    "right",

    () => {
        rightOn = true;
    },

    () => {
        rightOn = false;
    }
);


/* ==========================================
   تیراندازی
========================================== */

holdButton(
    "fire",

    () => {
        fireOn = true;
    },

    () => {
        fireOn = false;
    }
);


/* ==========================================
   Nitro
========================================== */

holdButton(
    "nitro",

    () => {
        nitroOn = true;
    },

    () => {
        nitroOn = false;
    }
);


/* ==========================================
   کیبورد
========================================== */

window.addEventListener(
    "keydown",
    event => {

        if(event.key === "ArrowLeft")
            leftOn = true;

        if(event.key === "ArrowRight")
            rightOn = true;

        if(event.code === "Space")
            fireOn = true;

        if(event.key.toLowerCase() === "n")
            nitroOn = true;

    }
);


window.addEventListener(
    "keyup",
    event => {

        if(event.key === "ArrowLeft")
            leftOn = false;

        if(event.key === "ArrowRight")
            rightOn = false;

        if(event.code === "Space")
            fireOn = false;

        if(event.key.toLowerCase() === "n")
            nitroOn = false;

    }
);


/* ==========================================
   شروع
========================================== */

function begin(){

    document.getElementById(
        "start"
    ).style.display = "none";

    running = true;

    kills = 0;
    hp = 100;
    distance = 0;
    nitro = 100;

    zombies = [];
    bullets = [];

    zombieContainer.innerHTML = "";

    x = innerWidth / 2;

    positionCar();

    last =
        performance.now();

    requestAnimationFrame(loop);

}


/* ==========================================
   شروع مجدد
========================================== */

function restart(){

    document.getElementById(
        "result"
    ).style.display = "none";

    begin();

}


/* ==========================================
   ایجاد زامبی
========================================== */

function spawnZombie(){

    const side =
        Math.random() < 0.5
        ? -1
        : 1;

    zombies.push({

        side,

        x:
            innerWidth / 2
            +
            side *
            (
                innerWidth * 0.18
                +
                Math.random() * 70
            ),

        y:
            innerHeight * 0.18
            +
            Math.random() * 40,

        speed:
            1.3
            +
            Math.random() * 1.4,

        latched:false,

        hp:100

    });

}


/* ==========================================
   تیر
========================================== */

function shoot(){

    if(shotTimer > 0)
        return;

    bullets.push({

        x:x,

        y:
            innerHeight * 0.78

    });

    shotTimer = 7;

}


/* ==========================================
   آپدیت
========================================== */

function update(dt){

    /* حرکت چپ */

    if(leftOn)
        x -= 7 * dt;


    /* حرکت راست */

    if(rightOn)
        x += 7 * dt;


    positionCar();


    /* Nitro */

    if(
        nitroOn &&
        nitro > 0
    ){

        distance +=
            0.035 * dt;

        nitro -=
            0.35 * dt;

    }else{

        distance +=
            0.012 * dt;

    }


    /* شلیک */

    if(fireOn)
        shoot();


    shotTimer -= dt;


    /* تولید زامبی */

    spawnTimer -= dt;

    if(spawnTimer <= 0){

        spawnZombie();

        spawnTimer =
            28 +
            Math.random() * 35;

    }


    /* حرکت زامبی‌ها */

    zombies.forEach(z => {

        z.y +=
            z.speed *
            (
                nitroOn
                ? 1.25
                : 1
            )
            *
            dt;


        /* چسبیدن به ماشین */

        if(
            Math.abs(z.x-x)<75 &&
            z.y>innerHeight*0.58
        ){

            z.latched = true;

        }


        if(z.latched){

            z.x +=
                (
                    x
                    +
                    z.side * 45
                    -
                    z.x
                )
                *
                0.04
                *
                dt;

            z.y =
                innerHeight * 0.72;


            hp -=
                0.08 *
                dt /
                armor;

        }

    });


    /* حرکت گلوله */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet =
            bullets[i];

        bullet.y -=
            18 * dt;


        for(
            let j=zombies.length-1;
            j>=0;
            j--
        ){

            const zombie =
                zombies[j];


            if(
                Math.abs(
                    bullet.x -
                    zombie.x
                ) < 45 &&

                Math.abs(
                    bullet.y -
                    zombie.y
                ) < 55
            ){

                zombie.hp -= damage;

                bullets.splice(i,1);


                if(zombie.hp <= 0){

                    kills++;

                    zombies.splice(
                        j,
                        1
                    );

                }

                break;

            }

        }

    }


    /* نمایش */

    render();


    document.getElementById(
        "kills"
    ).textContent = kills;


    document.getElementById(
        "hp"
    ).textContent =
        Math.max(
            0,
            Math.ceil(hp)
        );


    document.getElementById(
        "distance"
    ).textContent =
        distance.toFixed(2);


    document.getElementById(
        "nitroText"
    ).textContent =
        Math.max(
            0,
            Math.floor(nitro)
        );


    /* نابودی ماشین */

    if(hp <= 0){

        endGame();

    }

}


/* ==========================================
   نمایش زامبی‌ها
========================================== */

function render(){

    zombieContainer.innerHTML = "";


    zombies.forEach(
        zombie => {

            const element =
                document.createElement(
                    "div"
                );

            element.className =
                "z";

            element.textContent =
                "🧟";


            element.style.left =
                (
                    zombie.x - 29
                ) + "px";


            element.style.top =
                (
                    zombie.y - 40
                ) + "px";


            zombieContainer.appendChild(
                element
            );

        }
    );

}


/* ==========================================
   پایان
========================================== */

function endGame(){

    running = false;


    document.getElementById(
        "finalKills"
    ).textContent =
        kills;


    document.getElementById(
        "finalDistance"
    ).textContent =
        distance.toFixed(2);


    document.getElementById(
        "result"
    ).style.display =
        "grid";

}


/* ==========================================
   حلقه بازی
========================================== */

function loop(time){

    if(!running)
        return;


    const dt =
        Math.min(
            2,
            (time-last)/16.67
        );


    last = time;


    update(dt);


    requestAnimationFrame(
        loop
    );

}


/* ==========================================
   مقدار اولیه
========================================== */

positionCar();

</script>

</body>
</html>
